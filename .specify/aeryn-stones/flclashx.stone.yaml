name: flclashx
version: "0.3.2"
release: 1
homepage: https://github.com/pluralplay/FlClashX
upstreams:
  - https://github.com/pluralplay/FlClashX/releases/download/v0.3.2/FlClashX-linux-amd64.deb : 5540e98f2b7caed0daec73235098d656476be3b8df4dff9839e4a2d2e7d65861
summary: Fork of FlClash | A multi-platform proxy client based on ClashMeta
description: |
  FlClashX is a multi-platform proxy client based on ClashMeta, simple and easy to use, open-source and ad-free.
license:
  - GPL-3.0-or-later
rundeps:
  - libayatana-appindicator
  - libkeybinder3
install: |
  bsdtar xf /mason/sourcedir/FlClashX-linux-amd64.deb -C .
  bsdtar xf data.tar.* -C .
  mkdir -p %(installroot)%(libdir)/flclashx
  cp -Pr usr/share/FlClashX/* %(installroot)%(libdir)/flclashx/
  echo '#!/bin/sh' > %(installroot)%(bindir)/flclashx
  echo 'exec /usr/lib/flclashx/flclashx "$@"' >> %(installroot)%(bindir)/flclashx
  chmod +x %(installroot)%(bindir)/flclashx
  mkdir -p %(installroot)%(datadir)/applications
  sed 's/Exec=FlClashX/Exec=flclashx/; s/Icon=FlClashX/Icon=flclashx/' usr/share/applications/FlClashX.desktop > %(installroot)%(datadir)/applications/flclashx.desktop
  install -Dm00644 usr/share/icons/hicolor/128x128/apps/FlClashX.png %(installroot)%(datadir)/icons/hicolor/128x128/apps/flclashx.png
  install -Dm00644 usr/share/icons/hicolor/256x256/apps/FlClashX.png %(installroot)%(datadir)/icons/hicolor/256x256/apps/flclashx.png
