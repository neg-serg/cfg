name        : abduco
version     : "0.6"
release     : 2
homepage    : https://github.com/martanne/abduco
upstreams   :
    - https://github.com/martanne/abduco/archive/refs/tags/v0.6.tar.gz : 647d0381418f43a38f861d151b0efb2e3458ec651914e7d477956768b0af9bb7
summary     : A simple program to run programs in detached sessions
description : |
    abduco provides session management i.e. it allows programs to be
    run independently from its controlling terminal. That is programs
    can be detached - run in the background - and later reattached.
license     :
    - ISC
builddeps   :
    - binary(make)
build       : |
    %make PREFIX=%(prefix)
install     : |
    %make_install PREFIX=%(prefix)
