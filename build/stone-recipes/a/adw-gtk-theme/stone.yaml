name        : adw-gtk-theme
version     : "6.5"
release     : 1
homepage    : https://github.com/lassekongo83/adw-gtk3
upstreams   :
    - https://github.com/lassekongo83/adw-gtk3/archive/refs/tags/v6.5.tar.gz : fc9fc3b3e89d90d9a0e38bae05445ce9e65faf47acea3ac658e5f42566def473
summary     : Unofficial GTK3/GTK4 theme that looks like Adwaita
description : |
    Adwaita GTK theme is an unofficial GTK3/GTK4 theme that attempts
    to bring the GNOME Adwaita look to the GTK3/GTK4 toolkit.
license     :
    - LGPL-2.1-only
builddeps   :
    - binary(meson)
    - binary(ninja)
    - binary(node)
    - binary(npm)
networking  : true
setup       : |
    npm install -g sass
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
