name        : aria2
version     : "1.37.0"
release     : 1
homepage    : https://aria2.github.io/
upstreams   :
    - https://github.com/aria2/aria2/archive/refs/tags/release-1.37.0.tar.gz : 9104878396cc30441976afdd3af9331ec51306fabf92fb82724c3b8fa7d72932
summary     : A lightweight, multi-protocol, multi-source download utility
description : |
    aria2 is a lightweight multi-protocol and multi-source download utility
    that supports HTTP/HTTPS, FTP, SFTP, BitTorrent and Metalink.
license     :
    - GPL-2.0-or-later
builddeps   :
    - binary(g++)
    - binary(make)
    - binary(tar)
    - pkgconfig(libxml-2.0)
    - pkgconfig(libssh2)
    - pkgconfig(zlib)
    - pkgconfig(gnutls)
    - gettext-devel
setup       : |
    sed -i 's/hash->digest(ctx_.\+, getDigestLength(), md);/hash->digest(ctx_.get(), md);/' src/LibnettleMessageDigestImpl.cc
    autoreconf -fi
    %configure --without-libcares --without-sqlite3 --without-libuv --enable-bittorrent --enable-metalink
build       : |
    %make -j4
install     : |
    %make_install
