name        : atop
version     : "2.11.0"
release     : 1
homepage    : https://www.atoptool.nl/
upstreams   :
    - https://www.atoptool.nl/download/atop-2.11.0.tar.gz : 9b94c666602efff7bf402ecce706c347f38c39cb63498f9d39626861e5646e20
summary     : System and process monitor for Linux
description : |
    ATOP is an ASCII full-screen performance monitor for Linux
    that can show the system-wide resources and the per-process
    resources, including memory, CPU, disk, and network.
license     :
    - GPL-2.0-only
builddeps   :
    - binary(make)
    - pkgconfig(glib-2.0)
    - pkgconfig(ncursesw)
    - pkgconfig(zlib)
build       : |
    %make
install     : |
    %make_install DESTDIR=%(installroot)
