name        : abduco
version     : 0.6
release     : 1
homepage    : https://github.com/bmijen/abduco
upstreams   :
  - https://github.com/bmijen/abduco/archive/refs/tags/0.6.tar.gz
summary     : A simple program to run programs in detached sessions
description : |
  abduco provides session management i.e. it allows programs to be
  run independently from its controlling terminal. That is programs
  can be detached - run in the background - and later reattached.
  
  Together with dvtm it provides a great terminal environment.
