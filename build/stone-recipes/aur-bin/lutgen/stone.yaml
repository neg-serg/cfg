name: lutgen
version: "1.1.1"
release: 1
homepage: https://github.com/ozwaldorf/lutgen-rs
summary: A blazingly fast interpolated LUT utility for arbitrary and popular color palettes
description: |
  A blazingly fast interpolated LUT utility for arbitrary and popular color palettes.
license:
  - MIT
builddeps:
  - binary(wget)
networking: true
build: |
  wget -q https://github.com/ozwaldorf/lutgen-rs/releases/download/lutgen-studio-v0.4.0/lutgen-cli-v1.1.1-x86_64-unknown-linux-gnu
  echo "10610beeae51b3308b01d93be6c998dbda42c887c6ad85e4e22dd12ce6a21ba0  lutgen-cli-v1.1.1-x86_64-unknown-linux-gnu" | sha256sum -c
  mv lutgen-cli-v1.1.1-x86_64-unknown-linux-gnu lutgen
install: |
  %install_bin lutgen