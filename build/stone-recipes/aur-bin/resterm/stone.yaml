name: resterm
version: "0.41.1"
release: 1
homepage: https://github.com/unkn0wn-root/resterm
summary: Terminal REST client for .http/.rest files with HTTP, GraphQL and gRPC support
description: |
  Terminal REST client for .http/.rest files with HTTP, GraphQL and gRPC support.
license:
  - Apache-2.0
builddeps:
  - binary(wget)
networking: true
build: |
  wget -q https://github.com/unkn0wn-root/resterm/releases/download/v0.41.1/resterm_Linux_x86_64
  echo "ab41270709c3aeb76bbfe44760aa311bcd395858a12fe26be982cbabab6ed641  resterm_Linux_x86_64" | sha256sum -c
  mv resterm_Linux_x86_64 resterm
install: |
  %install_bin resterm