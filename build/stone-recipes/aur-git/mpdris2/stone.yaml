name: mpdris2
version: "0.1"
release: 1
homepage: https://github.com/eonpatapon/mpDris2
upstreams: []
summary: MPRIS V2.1 support for mpd
description: |
  mpDris2 provide MPRIS 2 support to mpd (Music Player Daemon).
license:
  - GPL-3.0
builddeps:
  - binary(make)
  - binary(intltoolize)
  - binary(autoreconf)
rundeps:
  - python-dbus
  - python-mutagen
networking: true
setup: |
  git clone --depth=1 https://github.com/eonpatapon/mpDris2.git .
  NOCONFIGURE=1 ./autogen.sh
build: |
  %configure --sysconfdir=/etc
  %make
install: |
  %make_install
