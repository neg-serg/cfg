name: pipemixer
version: "0.1"
release: 1
homepage: https://github.com/heather7283/pipemixer
upstreams: []
summary: TUI volume control app for pipewire
description: |
  A TUI volume control application for pipewire built with ncurses.
license:
  - GPL-3.0-or-later
builddeps:
  - binary(meson)
  - binary(ninja)
  - binary(pkg-config)
  - inih-devel
  - pipewire-devel
  - ncurses-devel
  - pkgconfig(inih)
  - pkgconfig(libpipewire-0.3)
  - pkgconfig(ncurses)
networking: true
setup: |
  git clone --depth=1 https://github.com/heather7283/pipemixer.git .
build: |
  %meson
  %meson_build
install: |
  %meson_install
