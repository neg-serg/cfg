name: rofi-file-browser-extended
version: "0.1"
release: 1
homepage: https://github.com/marvinkreis/rofi-file-browser-extended
upstreams: []
summary: Use rofi to quickly open files
description: |
  Use rofi to quickly open files
license:
  - MIT
builddeps:
  - binary(cmake)
  - binary(make)
  - rofi
networking: true
setup: |
  git clone --depth=1 https://github.com/marvinkreis/rofi-file-browser-extended.git .
build: |
  mkdir -p build
  cd build
  cmake .. -DCMAKE_INSTALL_PREFIX=/usr
  make
install: |
  cd build
  make install DESTDIR=%(builddir)
