name: xdg-desktop-portal-termfilechooser-hunkyburrito
version: "0.1"
release: 1
homepage: https://github.com/hunkyburrito/xdg-desktop-portal-termfilechooser
upstreams: []
summary: xdg-desktop-portal backend for terminal file choosers
description: |
  xdg-desktop-portal backend for your favorite terminal file chooser (hunkyburrito fork)
license:
  - MIT
builddeps:
  - binary(meson)
  - binary(ninja)
  - binary(pkg-config)
  - binary(scdoc)
  - inih-devel
  - systemd-devel
  - pkgconfig(inih)
  - pkgconfig(libsystemd)
  - xdg-desktop-portal
networking: true
setup: |
  git clone --depth=1 https://github.com/hunkyburrito/xdg-desktop-portal-termfilechooser.git .
build: |
  %meson -Dsd-bus-provider=libsystemd
  %meson_build
install: |
  %meson_install
