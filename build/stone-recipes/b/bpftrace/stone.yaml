name        : bpftrace
version     : "0.26.0"
release     : 1
homepage    : https://github.com/bpftrace/bpftrace
upstreams   :
    - https://github.com/bpftrace/bpftrace/archive/refs/tags/v0.26.0.tar.gz : 7f945cdee264168424c1f99feccb3666695ff8dfdd4f7469ef291851be8bf60d
    - https://github.com/USCiLab/cereal/archive/refs/tags/v1.3.2.tar.gz : 16a7ad9b31ba5880dac55d62b5d6f243c3ebc8d46a3514149e56b5e7ea81f85f
summary     : High-level tracing language for Linux eBPF
description : |
    bpftrace is a high-level tracing language for Linux eBPF.
    It is built on top of LLVM and BCC, and provides a powerful
    one-liner style syntax for dynamic tracing of kernel and user-space.
license     :
    - Apache-2.0
builddeps   :
    - binary(bison)
    - binary(flex)
    - binary(cmake)
    - binary(ninja)
    - binary(gcc)
    - llvm-devel
    - clang-devel
    - libbpf-devel
    - libbpf-staticlib
    - bcc-devel
    - binary(clang)
setup       : |
    mkdir -p cereal_include
    bsdtar-static xf /mason/sourcedir/v1.3.2.tar.gz -C cereal_include --strip-components=2 cereal-1.3.2/include
    export CPATH="%(workdir)/cereal_include:${CPATH:-}"
    %cmake \
        -DUSE_SYSTEM_LIBBPF=ON \
        -DBUILD_TESTING=OFF \
        -DENABLE_MAN=OFF \
        -DENABLE_SKB_OUTPUT=OFF
build       : |
    export CPATH="%(workdir)/cereal_include:${CPATH:-}"
    %cmake_build
install     : |
    %cmake_install

