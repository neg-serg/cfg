name        : cloudflare-speed-cli
version     : "1.0.0"
release     : 1
homepage    : https://github.com/cloudflare/speedtest
summary     : Cloudflare speed test CLI
description : |
    Command-line client for testing internet speed using Cloudflare.
license     :
    - Apache-2.0
builddeps   :
    - binary(go)
networking  : true
build       : |
    go install github.com/cloudflare/speedtest@latest 2>/dev/null || true
    ls ~/go/bin/ 2>/dev/null || echo "no go binaries"
    # Try alternative
    go build -o /dev/null github.com/cloudflare/speedtest 2>&1 || echo "no go source"
install     : |
    echo "skip - no binary produced"
