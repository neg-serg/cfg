name: cdrtools
version: "3.02a09"
release: 1
homepage: https://sourceforge.net/projects/cdrtools/
upstreams:
  - https://sourceforge.net/projects/cdrtools/files/cdrtools-3.02a09.tar.bz2 : aa28438f458ef3f314b79f2029db27679dae1d5ffe1569b6de57742511915e81
summary: CD/DVD/BluRay recording tools
description: |
  A set of tools for recording CD/DVD/BluRay media
license:
  - CDDL-1.0
  - GPL-2.0-only
  - LGPL-2.0-only
builddeps:
  - binary(make)
  - binary(gcc)
  - linux-headers
environment: |
  unset CFLAGS
  unset CXXFLAGS
  unset LDFLAGS
  unset CPPFLAGS
setup: |
  :
build: |
  make CC=gcc
install: |
  make install INSTALLDIR=%(installroot)/usr CC=gcc
