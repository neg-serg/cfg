name: w3m
version: "0.5.3+git20230121"
release: 2
homepage: https://github.com/tats/w3m
upstreams:
  - git|https://github.com/tats/w3m:
      ref: 7178f65c5390bfdd06575af77075e41d54141da3 # v0.5.3+git20230121
summary: A text-based web browser
description: |
  W3M is a text-based web browser as well as a pager like less
license:
  - MIT
builddeps:
  - binary(ar)
  - binary(make)
  - binary(gcc)
  - pkgconfig(bdw-gc)
  - pkgconfig(ncursesw)
  - pkgconfig(zlib)
  - pkgconfig(libssl)
setup: |
  ./configure --prefix=%(prefix) --with-gc=%(prefix) --enable-image=no --without-x
build: |
  %make
install: |
  %make_install
