name: zmap
version: "4.4.0"
release: 1
homepage: https://zmap.io
upstreams:
  - https://github.com/zmap/zmap/archive/refs/tags/v4.4.0.tar.gz : be4521fdac10eddc9ba046399149064ca23d4630b7987301abdee9e0044b8d5c
summary: Fast network scanner
description: |
  ZMap is a fast network scanner designed for Internet-wide network surveys.
license:
  - Apache-2.0
builddeps:
  - binary(cmake)
  - binary(gcc)
  - binary(g++)
  - binary(pkgconf)
  - binary(flex)
  - binary(bison)
  - json-c-devel
  - libpcap-devel
  - gmp-devel
setup: |
  sed -i '/FATAL_ERROR.*Judy/d' CMakeLists.txt
  sed -i '/find_library.*Judy/d' CMakeLists.txt
  %cmake -DWITH_JUDY=OFF -DENABLE_DEVELOPMENT=OFF
build: |
  %cmake_build
install: |
  %cmake_install
