name        : ddccontrol
version     : "2.2.0"
release     : 1
homepage    : https://github.com/ddccontrol/ddccontrol
upstreams   :
    - https://github.com/ddccontrol/ddccontrol/archive/refs/tags/2.2.0.tar.gz : f981ee48106f9a9d9862a0ec5a02113c853cda2b2529621ebcd76a1ffc45f786
summary     : DDC/CI monitor control tool
description : |
    ddccontrol allows controlling monitor parameters via DDC/CI.
license     :
    - GPL-2.0-only
builddeps   :
    - binary(make)
    - binary(gcc)
    - binary(autoconf)
    - binary(automake)
    - binary(slibtool)
    - binary(tar)
    - pkgconfig(libpci)
    - pkgconfig(libxml-2.0)
    - pkgconfig(gtk+-3.0)
    - intltool
    - intltool-devel
    - gettext-devel
setup       : |
    autoreconf -fi
    %configure --without-xsltproc-check
build       : |
    %make
install     : |
    %make_install
