name        : difftastic
version     : "0.69.0"
release     : 1
homepage    : https://github.com/Wilfred/difftastic
upstreams   :
    - https://github.com/Wilfred/difftastic/archive/refs/tags/0.69.0.tar.gz : 49d722fb80a0324ea99fe11907f796cde635443084d15cc6f1afd9e0de54bde0
summary     : Structural diff tool that understands syntax
description : |
    Difftastic is a structural diff tool that compares files based on their
    syntax, not their text. It understands over 30 programming languages.
license     : MIT
builddeps   :
    - binary(cargo)
    - binary(cmake)
    - binary(make)
    - binary(gcc)
    - binary(autoconf)
    - binary(automake)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install difft
