name        : dust
version     : "1.2.4"
release     : 1
homepage    : https://github.com/bootandy/dust
upstreams   :
    - https://github.com/bootandy/dust/archive/refs/tags/v1.2.4.tar.gz : 2f6768534bd01727234e67f1dd3754c9547aa18c715f6ee52094e881ebac50e3
summary     : A more intuitive version of du
description : |
    dust is a more intuitive version of du. It displays disk usage
    information in a tree-like format, showing which directories and
    files are taking up the most space.
license     : Apache-2.0
builddeps   :
    - binary(cargo)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
