name: blender
version: "5.1.2"
release: 1
homepage: https://www.blender.org/
upstreams:
  - https://download.blender.org/release/Blender5.1/blender-5.1.2-linux-x64.tar.xz : aaccb355f50183979b698bcce7467103a76261b5fa59f4972295842662a285fb
summary: 3D creation suite
description: |
  Blender is a free and open-source 3D computer graphics software toolset.
license:
  - GPL-2.0-or-later
  - Apache-2.0
install: |
  bsdtar xf /mason/sourcedir/blender-5.1.2-linux-x64.tar.xz -C .
  mkdir -p %(installroot)%(libdir)/blender
  cp -r blender-5.1.2-linux-x64/* %(installroot)%(libdir)/blender/
  mkdir -p %(installroot)%(bindir)
  ln -sf /usr/lib/blender/blender-launcher %(installroot)%(bindir)/blender
  mkdir -p %(installroot)%(datadir)/applications
  echo "[Desktop Entry]" > %(installroot)%(datadir)/applications/blender.desktop
  echo "Type=Application" >> %(installroot)%(datadir)/applications/blender.desktop
  echo "Name=Blender" >> %(installroot)%(datadir)/applications/blender.desktop
  echo "GenericName=3D Modeller" >> %(installroot)%(datadir)/applications/blender.desktop
  echo "Comment=3D creation suite" >> %(installroot)%(datadir)/applications/blender.desktop
  echo "Exec=blender %%f" >> %(installroot)%(datadir)/applications/blender.desktop
  echo "Icon=blender" >> %(installroot)%(datadir)/applications/blender.desktop
  echo "Terminal=false" >> %(installroot)%(datadir)/applications/blender.desktop
  echo "Categories=Graphics;3DGraphics;" >> %(installroot)%(datadir)/applications/blender.desktop
  echo "StartupNotify=true" >> %(installroot)%(datadir)/applications/blender.desktop
  echo "StartupWMClass=Blender" >> %(installroot)%(datadir)/applications/blender.desktop
  echo "MimeType=application/x-blender;" >> %(installroot)%(datadir)/applications/blender.desktop
  mkdir -p %(installroot)%(datadir)/icons/hicolor/scalable/apps
  echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#ea7600"/><text x="24" y="30" text-anchor="middle" font-size="20" fill="white" font-family="sans-serif" font-weight="bold">B</text></svg>' > %(installroot)%(datadir)/icons/hicolor/scalable/apps/blender.svg
