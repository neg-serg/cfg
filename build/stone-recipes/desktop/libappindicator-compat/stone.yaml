name: libappindicator-compat
version: "1.0.0"
release: 1
homepage: https://github.com/
summary: Compatibility symlinks for libappindicator
description: |
  Provides libappindicator soname compatibility via libayatana-appindicator.
license:
  - LGPL-2.1-or-later
provides:
  - soname(libappindicator3.so.1(x86_64))
rundeps:
  - libayatana-appindicator
install: |
  mkdir -p %(installroot)%(libdir)
  install -Dm00755 /dev/null %(installroot)%(libdir)/.compat-marker
