name: telegram-desktop
version: "6.8.2"
release: 1
homepage: https://telegram.org/
upstreams:
  - https://github.com/telegramdesktop/tdesktop/releases/download/v6.8.2/tsetup.6.8.2.tar.xz : 3e31fdabc2be8bc62e486da0586932e8115087e22dece8098977d14f1d13cf2b
summary: Official Telegram Desktop client
description: |
  Telegram Desktop is the official desktop client for the Telegram messenger.
license:
  - GPL-3.0-or-later
install: |
  bsdtar xf /mason/sourcedir/tsetup.6.8.2.tar.xz -C .
  install -Dm00755 Telegram/Telegram %(installroot)%(bindir)/telegram-desktop
  install -Dm00755 Telegram/Updater %(installroot)%(bindir)/telegram-desktop-updater
  mkdir -p %(installroot)%(datadir)/applications
  echo "[Desktop Entry]" > %(installroot)%(datadir)/applications/telegram-desktop.desktop
  echo "Type=Application" >> %(installroot)%(datadir)/applications/telegram-desktop.desktop
  echo "Name=Telegram Desktop" >> %(installroot)%(datadir)/applications/telegram-desktop.desktop
  echo "GenericName=Telegram Messenger" >> %(installroot)%(datadir)/applications/telegram-desktop.desktop
  echo "Comment=Official desktop client for Telegram" >> %(installroot)%(datadir)/applications/telegram-desktop.desktop
  echo "Exec=telegram-desktop" >> %(installroot)%(datadir)/applications/telegram-desktop.desktop
  echo "Icon=telegram-desktop" >> %(installroot)%(datadir)/applications/telegram-desktop.desktop
  echo "Terminal=false" >> %(installroot)%(datadir)/applications/telegram-desktop.desktop
  echo "Categories=Network;InstantMessaging;Chat;" >> %(installroot)%(datadir)/applications/telegram-desktop.desktop
  echo "StartupNotify=true" >> %(installroot)%(datadir)/applications/telegram-desktop.desktop
  echo "StartupWMClass=Telegram" >> %(installroot)%(datadir)/applications/telegram-desktop.desktop
  mkdir -p %(installroot)%(datadir)/icons/hicolor/256x256/apps
  install -Dm00644 /dev/null %(installroot)%(datadir)/icons/hicolor/256x256/apps/telegram-desktop.png
