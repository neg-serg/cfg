name        : erdtree
version     : "3.1.2"
release     : 1
homepage    : https://github.com/solidiquis/erdtree
upstreams   :
    - https://github.com/solidiquis/erdtree/archive/refs/tags/v3.1.2.tar.gz : 1758e7ad8f7be59bc3c6bda8b058097509f9db6f40ad57c4b0b361e3be439297
summary     : A modern file tree visualizer and disk usage analyzer
description : |
    erdtree is a modern file tree visualizer and disk usage analyzer
    that respects hidden files and .gitignore rules by default.
license     :
    - MIT
builddeps   :
    - binary(cargo)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install       : |
    install -Dm00755 -t %(installroot)/usr/bin target/x86_64-unknown-linux-gnu/release/erd
