name        : fclones
version     : "0.35.0"
release     : 1
homepage    : https://github.com/pkolaczk/fclones
upstreams   :
    - https://github.com/pkolaczk/fclones/archive/refs/tags/v0.35.0.tar.gz : 9d8bb36076190f799f01470f80e64c6a1f15f0d938793f8f607a2544cdd6115a
summary     : Efficient duplicate file finder and remover
description : |
    fclones is a efficient duplicate file finder and remover.
    It uses hashing and size comparison to quickly find duplicate files.
license     :
    - MIT
builddeps   :
    - binary(cargo)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install       : |
    install -Dm00755 -t %(installroot)/usr/bin target/x86_64-unknown-linux-gnu/release/fclones
