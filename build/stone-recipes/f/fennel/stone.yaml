name        : fennel
version     : "1.6.1"
release     : 1
homepage    : https://fennel-lang.org/
upstreams   :
    - https://github.com/bakpakin/fennel/archive/refs/tags/1.6.1.tar.gz : 8bf46040ea9554f4c132de6cb6bf26a30ce8f7c99e58e82bc971c533d91ecd71
summary     : A Lisp that compiles to Lua
description : |
    Fennel is a programming language that compiles to Lua. It aims to
    be easy to use, expressive, and has almost zero overhead compared
    to writing Lua directly.
license     :
    - MIT
builddeps   :
    - binary(lua)
    - binary(make)
build       : |
    %make PREFIX=%(prefix)
install     : |
    %make_install PREFIX=%(prefix) DESTDIR=%(installroot)
