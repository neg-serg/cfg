name        : figlet
version     : "2.2.5"
release     : 1
homepage    : https://github.com/cmatsuoka/figlet
upstreams   :
    - https://github.com/cmatsuoka/figlet/archive/refs/tags/2.2.5.tar.gz : 4d366c4a618ecdd6fdb81cde90edc54dbff9764efb635b3be47a929473f13930
summary     : Program for making large letters out of ordinary text
description : |
    FIGlet is a program for making large letters out of ordinary text.
    It can print in a variety of fonts and orientations.
license     :
    - BSD-3-Clause
    - MIT
builddeps   :
    - gcc
    - binutils
    - binary(make)
build       : |
    %make prefix=%(prefix) CC=gcc
install     : |
    %make_install prefix=%(prefix) DESTDIR=%(installroot)
