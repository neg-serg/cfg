name        : fio
version     : "3.42"
release     : 1
homepage    : https://github.com/axboe/fio
upstreams   :
    - https://github.com/axboe/fio/archive/refs/tags/fio-3.42.tar.gz : 56b03497a918d07692257890fd759bf73168ad79df5be78a2bcbbdc8ce67895b
summary     : Flexible I/O Tester
description : |
    fio is a flexible I/O tester and benchmark tool. It supports
    a large number of I/O engines and workloads.
license     :
    - GPL-2.0-only
builddeps   :
    - binary(gcc)
    - binary(make)
setup       : |
    ./configure --prefix=%(prefix)
build       : |
    %make
install     : |
    %make_install DESTDIR=%(installroot)
