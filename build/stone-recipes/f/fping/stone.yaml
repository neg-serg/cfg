name        : fping
version     : "5.5"
release     : 1
homepage    : https://github.com/schweikert/fping
upstreams   :
    - https://github.com/schweikert/fping/archive/refs/tags/v5.5.tar.gz : e99293d31a77258b2e4a5639ff40f68db1424ce1105c3536353019e77072ba32
summary     : A program to ping multiple hosts
description : |
    fping is a program to send ICMP echo probes to network hosts,
    similar to ping, but with much better performance when pinging
    multiple hosts.
license     :
    - BSD-3-Clause
builddeps   :
    - binary(gcc)
    - binary(make)
    - binary(autoreconf)
setup       : |
    autoreconf -fi
    %configure
build       : |
    %make
install     : |
    %make_install
