name        : fix-dns
version     : "1.0"
release     : 1
homepage    : https://example.com
summary     : test DNS in boulder
description : test
license     : MIT
networking  : true
build       : |
    echo "=== RESOLV.CONF ==="
    cat /etc/resolv.conf
    echo "=== CURL crates.io ==="
    curl -v --max-time 15 https://crates.io 2>&1 | tail -20
    echo "=== PING ==="
    ping -c 2 -W 5 8.8.8.8 2>&1 | tail -5 || true
    exit 0
install      : |
    mkdir -p %(installroot)/usr/share
    echo ok > %(installroot)/usr/share/test
