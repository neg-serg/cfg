name        : geoip-database
version     : "20230414"
release     : 1
homepage    : https://mailfud.org/geoip-legacy/
upstreams   :
    - file:///home/neg/stone-recipes/g/geoip-database/geoip-database-20230414.tar.gz : 90b8f8c5c8f1178a9c04f03ece2535c1f1e6ad0dfaf9716e0591b0b0a27b9587
summary     : GeoIP legacy country database
description : |
    GeoIP legacy country database (based on GeoLite2 data created by MaxMind).
    Provides GeoIP.dat and GeoIPv6.dat for IP-to-country lookup.
license     :
    - CC-BY-SA
install     : |
    install -dm00755 %(installroot)%(datadir)/GeoIP/
    install -Dm00644 GeoIP.dat %(installroot)%(datadir)/GeoIP/GeoIP.dat
    install -Dm00644 GeoIPv6.dat %(installroot)%(datadir)/GeoIP/GeoIPv6.dat
