name: gitlogue
version: "0.9.0"
release: 1
homepage: https://github.com/unhappychoice/gitlogue
upstreams:
  - https://github.com/unhappychoice/gitlogue/archive/refs/tags/v0.9.0.tar.gz : e0e7c7def40757a41081b0e76daab0fd9f40af2840028b382e02728dcf3e9c8d
summary: A cinematic Git commit replay tool
description: |
  A cinematic Git commit replay tool for the terminal, turning your Git history into a living, animated story.
license:
  - MIT
builddeps:
  - binary(cargo)
  - binary(perl)
  - openssl-devel
networking: true
setup: |
  export OPENSSL_NO_VENDOR=1
  %cargo_fetch
build: |
  export OPENSSL_NO_VENDOR=1
  %cargo_build
install: |
  export OPENSSL_NO_VENDOR=1
  %cargo_install
