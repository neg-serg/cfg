name: gptfdisk
version: "1.0.10"
release: 1
homepage: https://sourceforge.net/projects/gptfdisk/
upstreams:
  - https://downloads.sourceforge.net/project/gptfdisk/gptfdisk/1.0.10/gptfdisk-1.0.10.tar.gz : 2abed61bc6d2b9ec498973c0440b8b804b7a72d7144069b5a9209b2ad693a282
summary: GPT fdisk disk partitioning tools
description: |
  GPT fdisk is a disk partitioning tool loosely modeled on Linux fdisk, but used for modifying GUID Partition Table (GPT) disks.
license:
  - GPL-2.0-only
builddeps:
  - binary(make)
  - binary(gcc)
  - popt-devel
  - icu-devel
  - libuuid-devel
  - ncurses-devel
setup: |
  sed -i "s|<ncursesw/ncurses.h>|<ncurses.h>|g" *.cc *.h
build: |
  make -f Makefile
install: |
  install -Dm00755 gdisk %(installroot)/usr/bin/gdisk
  install -Dm00755 sgdisk %(installroot)/usr/bin/sgdisk
  install -Dm00755 cgdisk %(installroot)/usr/bin/cgdisk
  install -Dm00755 fixparts %(installroot)/usr/bin/fixparts
