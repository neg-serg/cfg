name        : hxd
version     : "1.0.0"
release     : 1
homepage    : https://github.com/kiedtl/huxdemp
upstreams   :
    - https://github.com/kiedtl/huxdemp/archive/refs/tags/1.0.0.tar.gz : c680dda9be05bd8ab5f9493ac6483544d46e2a9897d51f0685f4534e8a192b68
summary     : A better hexdump
description : |
    A highly advanced hexdump utility with colors Lua plugins and Unicode support.
license     :
    - GPL-3.0-only
builddeps   :
    - binary(make)
    - binary(clang)
    - pkgconfig(lua)
    - binary(scdoc)
setup       : |
    ln -sf /usr/include/lua5.5 /usr/include/lua5.3 2>/dev/null || true
    ln -sf /usr/lib/liblua.so.5.5 /usr/lib/liblua5.3.so 2>/dev/null || true
build       : |
    make -j$(nproc) CC=clang LD=lld
install     : |
    make install CC=clang LD=lld PREFIX=/usr DESTDIR=%(installroot)
