name        : libtermkey
version     : "0.22"
release     : 1
homepage    : https://github.com/neovim/libtermkey
upstreams   :
    - https://github.com/neovim/libtermkey/archive/refs/tags/v0.22.tar.gz : 81cac2b685c9ada4ead4ea788fb69ff74fc1947ad188ed0264c646fe12b496ba
summary     : Library for terminal key input
description : |
    A library for easy keyboard input in terminal applications
license     : MIT
builddeps   :
    - binary(make)
    - binary(gcc)
    - binary(libtool)
    - pkgconfig(ncursesw)
build       : |
    %make PREFIX=%(prefix)
install     : |
    %make_install PREFIX=%(prefix)
