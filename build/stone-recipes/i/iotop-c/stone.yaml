name        : iotop-c
version     : "1.31"
release     : 1
homepage    : https://github.com/Tomas-M/iotop
upstreams   :
    - https://github.com/Tomas-M/iotop/archive/refs/tags/v1.31.tar.gz : 658a615eb1def9dddcf0c325efebb4f78b101a040fff33ef7afaaa39c2471669
summary     : I/O monitoring tool
description : |
    A simple I/O monitoring tool written in C.
license     :
    - GPL-2.0-only
builddeps   :
    - binary(clang)
    - binary(make)
    - pkgconfig(ncurses)
build       : |
    make -j$(nproc) CC=clang
install     : |
    make install DESTDIR=%(installroot)
