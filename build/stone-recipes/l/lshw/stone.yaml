name        : lshw
version     : "02.20"
release     : 1
homepage    : https://github.com/lyonel/lshw
upstreams   :
    - https://github.com/lyonel/lshw/archive/refs/tags/B.02.20.tar.gz : 6b8346a89fb0f0f1798e66f6a707a881d38b9b3a67256b30fc4628dac09f291a
summary     : Hardware lister
description : |
    lshw displays detailed hardware information.
license     : GPL-2.0-only
builddeps   :
    - binary(make)
    - binary(gcc)
    - binary(g++)
    - gettext-devel
build       : |
    %make -C src PREFIX=%(prefix)
install     : |
    make -C src install PREFIX=%(prefix) DESTDIR=%(installroot)
