name        : mandoc
version     : "1.14.6"
release     : 1
homepage    : https://mandoc.bsd.lv/
upstreams   :
    - https://mandoc.bsd.lv/snapshots/mandoc-1.14.6.tar.gz : 8bf0d570f01e70a6e124884088870cbed7537f36328d512909eb10cd53179d9c
summary     : BSD mandoc documentation system
description : |
    mandoc is the BSD man page documentation system.
license     : ISC
builddeps   :
    - binutils
    - binary(make)
    - binary(gcc)
    - pkgconfig(zlib)
setup       : |
    ./configure
build       : |
    %make
install     : |
    %make_install
