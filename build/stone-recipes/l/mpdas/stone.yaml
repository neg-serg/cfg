name        : mpdas
version     : "0.4.5"
release     : 1
homepage    : https://github.com/hrkfdn/mpdas
upstreams   :
    - https://github.com/hrkfdn/mpdas/archive/refs/heads/master.tar.gz : 23a4b5ce3a2d384e091c4eddd6ba6a2c868a45f6a0adbcfe2b3e79ec2eb8c411
summary     : MPD Audio Scrobbler
description : |
    mpdas is an AudioScrobbler client for MPD.
license     : MIT
builddeps   :
    - binary(make)
    - binary(gcc)
    - binary(g++)
    - pkgconfig(libcurl)
    - pkgconfig(libmpdclient)
build       : |
    %make PREFIX=%(prefix)
install     : |
    %make_install PREFIX=%(prefix)
