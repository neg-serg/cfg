name        : lowdown
version     : "1.3.1"
release     : 2
homepage    : https://github.com/kristapsdz/lowdown
upstreams   :
    - https://github.com/kristapsdz/lowdown/archive/refs/tags/VERSION_1_3_1.tar.gz : 028b77171cfa03d8360aaaaab81ef3ab1e99f9623cd39e62c5dae82ebad7c5db
summary     : Simple markdown translator
description : |
    lowdown is a simple markdown translator written in C.
license     :
    - ISC
builddeps   :
    - binary(gcc)
    - binary(make)
setup       : |
    ./configure PREFIX=/usr
build       : |
    %make
install     : |
    %make_install DESTDIR=%(installroot)
