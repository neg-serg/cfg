name        : neo-matrix
version     : "0.6.1"
release     : 1
homepage    : https://github.com/st3w/neo
upstreams   :
    - https://github.com/st3w/neo/archive/refs/tags/v0.6.1.tar.gz : 744a88cc6b98a4625ae5c5ee819640561f3df87518be0f9fca00ad787814b200
summary     : Terminal matrix-like screensaver
description : |
    Neo is a terminal matrix-like screensaver that displays scrolling
    green characters in the style of The Matrix movie.
license     : GPL-3.0-only
builddeps   :
    - binary(make)
    - binary(gcc)
    - ncurses-devel
    - autoconf
    - automake
setup       : |
    autoreconf -fi
    %configure
build       : |
    %make
install     : |
    %make_install
