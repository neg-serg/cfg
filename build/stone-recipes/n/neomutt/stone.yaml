name        : neomutt
version     : "20180716"
release     : 1
homepage    : https://github.com/neomutt/neomutt
upstreams   :
    - https://github.com/neomutt/neomutt/archive/refs/tags/neomutt-20180716.tar.gz : bd89826980b493ba312228c9c14ffe2403e268571aea6008c6dc7ed3848de200
summary     : A small but very powerful text-based mail client
description : |
    NeoMutt is a command line mail reader with a lot of features
    including MIME, GPG, and a highly customizable interface.
license     : GPL-2.0-only
builddeps   :
    - binary(make)
    - binary(gcc)
    - ncurses-devel
    - openssl-devel
    - gettext-devel
setup       : |
    %configure --disable-doc --disable-nls --disable-idn
build       : |
    %make
install     : |
    %make_install
