name        : no-more-secrets
version     : "1.0.1"
release     : 1
homepage    : https://github.com/bartobri/no-more-secrets
upstreams   :
    - https://github.com/bartobri/no-more-secrets/archive/refs/tags/v1.0.1.tar.gz : 4422e59bb3cf62bca3c73d1fdae771b83aab686cd044f73fe14b1b9c2af1cb1b
summary     : Terminal recreation of the data decryption effect from Sneakers
description : |
    This project provides a command-line tool that recreates the iconic
    data decryption effect from the movie Sneakers.
license     : GPL-3.0-only
builddeps   :
    - binary(make)
    - binary(gcc)
    - ncurses-devel
build       : |
    %make
install     : |
    %make_install prefix=/usr
