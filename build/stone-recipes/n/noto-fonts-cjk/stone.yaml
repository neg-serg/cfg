name        : noto-fonts-cjk
version     : "2.004"
release     : 1
homepage    : https://github.com/notofonts/noto-cjk
upstreams   :
    - https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/00_NotoSansCJK.ttc.zip : a56077736038875f3a5b1e6715b2713a2bd049cc0bf0dfdf645927b070d38bfc
summary     : Google Noto Sans CJK font
description : |
    Google Noto Sans CJK font covering Chinese, Japanese, and Korean scripts.
    Includes regular, bold, and other weights in TrueType Collection format.
license     :
    - OFL-1.1
install     : |
    install -dm00755 %(installroot)%(datadir)/fonts/TTF/
    find %(workdir) -name "*.ttc" -o -name "*.ttf" -exec install -Dm00644 {} %(installroot)%(datadir)/fonts/TTF/ \;
