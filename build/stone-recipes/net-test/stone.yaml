name        : net-test
version     : "1.0"
release     : 1
homepage    : https://example.com
summary     : test networking
description : test
license     : MIT
networking  : true
build       : |
    echo "RESOLV_CONF_START"
    cat /etc/resolv.conf
    echo "RESOLV_CONF_END"
    echo "HOSTS_START"
    cat /etc/hosts 2>/dev/null || echo "no hosts"
    echo "HOSTS_END"
    echo "NSLOOKUP_START"
    nslookup crates.io 2>&1 || true
    echo "NSLOOKUP_END"
    echo "CURL_START"
    curl -v --max-time 10 https://crates.io 2>&1 || true
    echo "CURL_END"
    mkdir -p %(installroot)/test
    echo ok > %(installroot)/test/ok
install      : |
    mkdir -p %(installroot)/test
    echo ok > %(installroot)/test/ok
