name: openbsd-netcat
version: "1.229"
release: 1
homepage: https://tracker.debian.org/pkg/netcat-openbsd
upstreams:
  - https://deb.debian.org/debian/pool/main/n/netcat-openbsd/netcat-openbsd_1.229.orig.tar.gz : 493e3973ffca7fedf0435e498bf18ebc934b1c3aa76db2b29cf80f98d9175a86
summary: TCP/IP swiss army knife (OpenBSD variant)
description: |
  A simple Unix utility which reads and writes data across network
  connections using TCP or UDP protocol.
license:
  - BSD-3-Clause-Clear
builddeps:
  - binary(gcc)
  - binary(make)
setup: |
  printf 'all: nc\nnc: netcat.c atomicio.c socks.c\n\t$(CC) $(CFLAGS) $(LDFLAGS) -o $@ $^ -ltls -lssl -lcrypto\nclean:\n\trm -f nc\n' > Makefile
build: |
  make
install: |
  install -Dm0755 nc "%(installroot)/%(prefix)/bin/nc"
  install -Dm0755 nc "%(installroot)/%(prefix)/bin/netcat-openbsd"
