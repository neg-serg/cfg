name: openrgb
version: "0.9"
release: 1
homepage: https://openrgb.org
upstreams:
  - https://github.com/CalcProgrammer1/OpenRGB/archive/refs/tags/release_0.9.tar.gz : 2e62799339b72b6d3afc4792e6ff39487583210bb5ddde93e2daa38ae35381c2
summary: RGB lighting control software
description: |
  OpenRGB is a cross-platform RGB lighting control program.
license:
  - GPL-2.0-only
builddeps:
  - binary(cmake)
  - binary(gcc)
  - binary(g++)
  - hidapi-devel
  - libusb-devel
setup: |
  %cmake -DENABLE_PHYSICAL_MOUSE=OFF
build: |
  %cmake_build
install: |
  %cmake_install
