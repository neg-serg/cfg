name: oyo
version: 0.1.33
release: 1
homepage: https://github.com/ahkohd/oyo
upstreams:
  - https://github.com/ahkohd/oyo/archive/refs/tags/v0.1.33.tar.gz : 4e2ee2332caa5cdc360574320740d5ff0225e738f0026c3d33feca39c1af8f12
summary: Step-through diff viewer
description: |
  Oyo is a CLI TUI step-through diff viewer for git.
license:
  - MIT
builddeps:
  - binary(cargo)
networking: true
setup: |
  cargo fetch --locked
build: |
  cargo build --release --locked
install: |
  install -Dm00755 -t %(installroot)/%(prefix)/bin target/release/oy
  install -Dm00755 -t %(installroot)/%(prefix)/bin target/release/oy-profile
