name: pigz
version: "2.8"
release: 1
homepage: https://zlib.net/pigz/
upstreams:
  - https://zlib.net/pigz/pigz-2.8.tar.gz : eb872b4f0e1f0ebe59c9f7bd8c506c4204893ba6a8492de31df416f0d5170fd0
summary: Parallel implementation of gzip
description: |
  pigz is a parallel implementation of gzip
license:
  - Zlib
builddeps:
  - binary(make)
  - binary(gcc)
  - binutils
  - zlib-devel
build: |
  make
install: |
  install -Dm0755 pigz %(installroot)/%(prefix)/bin/pigz
  install -Dm0755 unpigz %(installroot)/%(prefix)/bin/unpigz
