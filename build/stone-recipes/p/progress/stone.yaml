name: progress
version: "0.17"
release: 1
homepage: https://github.com/Xfennec/progress
upstreams:
  - https://github.com/Xfennec/progress/archive/refs/tags/v0.17.tar.gz : ee9538fce98895dcf0d108087d3ee2e13f5c08ed94c983f0218a7a3d153b725d
summary: Coreutils progress viewer
description: |
  progress shows the progress of running coreutils commands
license:
  - GPL-3.0-only
builddeps:
  - binary(make)
  - binary(gcc)
  - binutils
  - ncurses-devel
  - binary(pkgconf)
  - binary(which)
build: |
  make
install: |
  make install DESTDIR=%(installroot) PREFIX=%(prefix)
