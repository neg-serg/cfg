name: python-frozenlist
version: "1.8.0"
release: 1
homepage: https://pypi.org/project/frozenlist
upstreams:
  - https://pypi.debian.net/frozenlist/frozenlist-1.8.0.tar.gz : 3ede829ed8d842f6cd48fc7081d7a41001a56f1f38603f9d49bf3020d59a31ad
summary: List-like structure with immutable underlying data
description: |
  frozenlist is a list-like structure with immutable underlying data.
license:
  - Apache-2.0
builddeps:
  - python-setuptools
  - python-devel
  - cython
  - python-build
  - python-installer
  - python-pip
networking: true
rundeps:
  - python-libs
build: |
  pip install --no-build-isolation expandvars
  python -m build --wheel --no-isolation
install: |
  %pyproject_install
  %python_compile
