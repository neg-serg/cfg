name: python-yarl
version: "1.24.2"
release: 1
homepage: https://pypi.org/project/yarl
upstreams:
  - https://pypi.debian.net/yarl/yarl-1.24.2.tar.gz : 9ac374123c6fd7abf64d1fec93962b0bd4ee2c19751755a762a72dd96c0378f8
summary: URL library for Python
description: |
  Yet another URL library for Python.
license:
  - Apache-2.0
builddeps:
  - python-setuptools
  - python-devel
  - cython
  - python-build
  - python-installer
  - python-pip
networking: true
rundeps:
  - python-libs
build: |
  pip install --no-build-isolation expandvars
  python -m build --wheel --no-isolation
install: |
  %pyproject_install
  %python_compile
