name        : raise
version     : "1.0"
release     : 1
homepage    : https://github.com/nicknamenamenick/raise
upstreams   :
    - https://github.com/nicknamenamenick/raise/archive/refs/tags/v1.0.tar.gz : 92b5efc05d41b50c4a0f7cbf7aad8ac5e61e65ecf648e3d73aae74e9c24b4f4d
summary     : Utility to raise windows
description : |
    A simple command-line utility to raise (focus) windows by title or class.
license     :
    - MIT
builddeps   :
    - binary(gcc)
build       : |
    gcc -o raise raise.c -lX11
install     : |
    %install_bin raise
