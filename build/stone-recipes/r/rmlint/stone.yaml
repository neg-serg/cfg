name        : rmlint
version     : "2.10.2"
release     : 1
homepage    : https://github.com/sahib/rmlint
upstreams   :
    - https://github.com/sahib/rmlint/archive/refs/tags/v2.10.2.tar.gz : 0a0233ad517e0fb721f21e188a57cdee5279dd5329b38acb56d5d5312ce46388
summary     : Find duplicate files and other lint
description : |
    rmlint finds space waste and other broken things on your filesystem.
license     :
    - GPL-3.0-or-later
builddeps   :
    - binary(scons)
    - binary(gcc)
    - binary(python3)
    - glib2-devel
setup       : |
    scons
build       : |
    echo "built in setup"
install       : |
    scons install --prefix=%(prefix) --destdir=%(installroot)
