name        : rygel
version     : "0.42.5"
release     : 1
homepage    : https://wiki.gnome.org/Projects/Rygel
upstreams   :
    - https://download.gnome.org/sources/rygel/0.42/rygel-0.42.5.tar.xz : 1133602d2e6710aade6b22aa98d93384c8d56396f344763413e96e0110b7d89f
summary     : UPnP/DLNA media server
description : |
    Rygel is a home media server (UPnP/DLNA) written in C.
license     :
    - LGPL-2.1-or-later
builddeps   :
    - binary(meson)
    - binary(gcc)
    - pkgconfig(glib-2.0)
    - pkgconfig(gstreamer-play-1.0)
    - pkgconfig(libxml-2.0)
    - pkgconfig(sqlite3)
    - pkgconfig(gupnp-dlna-2.0)
    - pkgconfig(gupnp-av-1.0)
    - libx11-devel
setup       : |
    %meson
build       : |
    %meson_build
install       : |
    %meson_install
