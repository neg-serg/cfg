name        : python-uwsm
version     : 0.26.4
release     : 1
homepage    : https://github.com/Vladimir-csp/uwsm
upstreams   :
    - https://github.com/Vladimir-csp/uwsm/archive/refs/tags/v0.26.4.tar.gz : b7eeb03ab3950db933d3561d229ee9da55235f7f9ff5e481d6e90b3288f52954
summary     : Universal Wayland Session Manager
description : |
    Universal Wayland Session Manager
license     : MIT
builddeps   :
    - binary(meson)
    - binary(gcc)
    - binary(python3)
    - python-dbus
    - python-setuptools
    - python-build
    - python-wheel
    - python-installer
rundeps     :
    - python-libs
networking  : true
setup       : |
    meson setup build --prefix=%(prefix)
build       : |
    meson compile -C build
install     : |
    DESTDIR=%(installroot) meson install -C build
