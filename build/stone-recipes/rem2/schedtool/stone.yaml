name        : schedtool
version     : 1.3.0
release     : 1
homepage    : https://packages.debian.org/sid/schedtool
upstreams   :
    - http://ftp.debian.org/debian/pool/main/s/schedtool/schedtool_1.3.0.orig.tar.gz : 6628e4e805fab9c72b2daeb300c599d3de581f48eb21ce6caee3ae530b18450e
summary     : Query or set CPU scheduling settings
description : |
    schedtool queries or sets CPU scheduling settings for processes
    that are already running or that will be started by schedtool.
license     : GPL-2.0-or-later
builddeps   :
    - binary(make)
    - binary(gcc)
    - binutils
build       : |
    make CFLAGS="-O2 -pipe -Wno-error=int-conversion" LDFLAGS=""
install     : |
    make install PREFIX=%(prefix) DESTDIR=%(installroot)
