name        : id3v2
version     : "0.1.12"
release     : 1
homepage    : https://sourceforge.net/projects/id3v2/
upstreams   :
    - https://downloads.sourceforge.net/project/id3v2/id3v2/0.1.12/id3v2-0.1.12.tar.gz : 8105fad3189dbb0e4cb381862b4fa18744233c3bbe6def6f81ff64f5101722bf
summary     : MP3 tagger
description : |
    A command line id3v2 tag editor
license     : LGPL-2.0-or-later
builddeps   :
    - binary(make)
    - binary(gcc)
setup       : |
    make
build       : |
    :
install     : |
    install -D -m 755 id3v2 %(installroot)/usr/bin/id3v2
    install -D -m 644 id3v2.1 %(installroot)/usr/share/man/man1/id3v2.1
