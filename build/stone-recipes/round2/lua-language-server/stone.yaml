name: lua-language-server
version: "3.18.2"
release: 7
homepage: https://github.com/LuaLS/lua-language-server
upstreams:
  - git|https://github.com/LuaLS/lua-language-server:
      ref: 6dc1a32a141c69d8d52856a8b26f966f624fc76f
summary: Lua language server
description: |
  Lua Language Server
license:
  - MIT
builddeps:
  - binary(gcc)
  - binary(g++)
  - binary(ninja)
  - binary(as)
  - binary(ar)
networking: true
setup: |
  git submodule update --init --recursive
  ar rcs /usr/lib64/libstdc++fs.a
  printf 'INPUT ( /usr/lib/libstdc++.so )' > /usr/lib64/libstdc++.a
  sed -i 's/-lstdc++fs//g' 3rd/luamake/compile/ninja/linux.ninja
  cd 3rd/luamake
  ./compile/install.sh
  cd ../..
build: |
  ./3rd/luamake/luamake rebuild
install: |
  mkdir -p %(installroot)%(prefix)/bin
  cp -r bin/* %(installroot)%(prefix)/bin/
  mkdir -p %(installroot)%(prefix)/share/lua-language-server
  cp -r meta script locale %(installroot)%(prefix)/share/lua-language-server/ 2>/dev/null || true
