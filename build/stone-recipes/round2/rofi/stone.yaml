name        : rofi
version     : "1.7.8"
release     : 1
homepage    : https://github.com/davatorium/rofi
upstreams   :
    - https://github.com/davatorium/rofi/releases/download/1.7.8/rofi-1.7.8.tar.gz : 469fba08ad99f286a4a8c65f857c9f66c07e7b9a3496ac1fe3dcd856f3c687d3
summary     : X11 launcher
description : |
    A window switcher, application launcher and dmenu replacement
license     : MIT
builddeps   :
    - pkgconf-devel
    - libx11-devel
    - libxcb-devel
    - xcb-util-devel
    - xcb-util-wm-devel
    - pango-devel
    - cairo-devel
    - glib2-devel
    - gdk-pixbuf-devel
    - startup-notification-devel
    - libxkbcommon-devel
    - libxft-devel
    - freetype-devel
    - flex
    - bison
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
