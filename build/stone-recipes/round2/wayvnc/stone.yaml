name        : wayvnc
version     : "0.9.1"
release     : 1
homepage    : https://github.com/any1/wayvnc
upstreams   :
    - https://github.com/any1/wayvnc/archive/refs/tags/v0.9.1.tar.gz : aaaca02d36e54ec6ecf457dc266251946d895ac91521fbabb3470c3c09b3753c
summary     : VNC server for Wayland compositors
description : |
    A VNC server for wlroots-based Wayland compositors
license     : ISC
builddeps   :
    - binary(meson)
    - binary(gcc)
    - binary(pkgconf)
    - pkgconfig(neatvnc)
    - pkgconfig(pixman-1)
    - pkgconfig(aml)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
