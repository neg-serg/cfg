name        : wofi
version     : "1.4.1"
release     : 1
homepage    : https://hg.sr.ht/~scoopta/wofi
upstreams   :
    - https://hg.sr.ht/~scoopta/wofi/archive/v1.4.1.tar.gz : e95e35c03551c39178c16ad6213a88e3883a236e942d7f2666c780d934c270bb
summary     : Wayland launcher
description : |
    A launcher/menu program for wlroots based wayland compositors
license     : GPL-3.0-only
builddeps   :
    - binary(wayland-scanner)
    - pkgconf-devel
    - wayland-devel
    - gtk-3-devel
    - pango-devel
    - cairo-devel
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
