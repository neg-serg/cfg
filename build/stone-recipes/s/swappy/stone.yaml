name        : swappy
version     : "1.5.1"
release     : 1
homepage    : https://github.com/jtheoof/swappy
upstreams   :
    - https://github.com/jtheoof/swappy/archive/refs/tags/v1.5.1.tar.gz : 266fac289d4b903d80d44746044bafe8a8b663c6032be696c651ad390bcb1850
summary     : Screenshot annotation tool
description : |
    Swappy is a command-line screenshot annotation tool for Wayland.
license     :
    - MIT
builddeps   :
    - binary(meson)
    - binary(gcc)
    - binary(g++)
    - gettext-devel
    - gettext-devel
    - binary(msgfmt)
    - pkgconfig(glib-2.0)
    - pkgconfig(pango)
    - pkgconfig(cairo)
    - pkgconfig(gtk+-3.0)
setup       : |
    %meson
build       : |
    %meson_build
install       : |
    %meson_install
