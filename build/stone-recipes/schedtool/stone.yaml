name        : schedtool
version     : 1.3.0
release     : 1
homepage    : https://github.com/free-electrons/schedtool
upstreams   :
  - https://github.com/free-electrons/schedtool/archive/refs/tags/v1.3.0.tar.gz
summary     : Query or set CPU scheduling settings
description : |
  schedtool queries or sets CPU scheduling settings for processes
  that are already running or that will be started by schedtool.
license     : GPL-2.0-or-later
builddeps   :
  - binary(make)
  - binary(gcc)
build       : |
  %make
install     : |
  %make_install
