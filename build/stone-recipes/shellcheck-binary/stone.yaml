name        : shellcheck
version     : "0.10.0"
release     : 1
homepage    : https://www.shellcheck.net/
upstreams   :
    - https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz : 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
summary     : Shell script static analysis tool
description : |
    ShellCheck is a GPLv3 tool that gives warnings and suggestions for bash/sh shell scripts.
license     :
    - GPL-3.0-or-later
networking  : true
build       : |
    bsdtar xf /mason/sourcedir/shellcheck-v0.10.0.linux.x86_64.tar.xz
install     : |
    %install_exe shellcheck-v0.10.0/shellcheck %(installroot)%(bindir)/shellcheck
