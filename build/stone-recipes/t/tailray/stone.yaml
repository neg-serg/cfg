name        : tailray
version     : "0.3.0"
release     : 1
homepage    : https://github.com/NotAShelf/tailray
upstreams   :
    - https://github.com/NotAShelf/tailray/archive/refs/tags/v0.3.0.tar.gz : a7d74393b3c916a9fa49a2b3d0378638b081610e2a6a4da4f1818019d515faa0
summary     : A Rust implementation of tailscale-systray
description : |
    A simple systray for Tailscale written in Rust.
license     :
    - MIT
builddeps   :
    - binary(cargo)
