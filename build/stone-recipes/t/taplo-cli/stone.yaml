name        : taplo-cli
version     : "0.9.3"
release     : 1
homepage    : https://github.com/tamasfe/taplo
upstreams   :
    - https://github.com/tamasfe/taplo/archive/refs/tags/0.9.3.tar.gz : 65510664071252541e66f603dc9aa04016c38d62299061419c95d3bffaa73125
summary     : A TOML toolkit written in Rust
description : |
    A TOML toolkit with CLI, LSP server, and formatting.
license     :
    - MIT
builddeps   :
    - binary(cargo)
networking  : true
setup       : |
    cargo generate-lockfile
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install taplo
