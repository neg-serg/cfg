name        : tealdeer
version     : "1.7.0"
release     : 1
homepage    : https://github.com/dbrgn/tealdeer
upstreams   :
    - https://github.com/dbrgn/tealdeer/archive/refs/tags/v1.7.0.tar.gz : 940fe96a44571f395ac8349e5cba7ddb9231ce526bee07a9eb68f02c32f7da7b
