name        : toilet
version     : "0.3"
release     : 1
homepage    : https://github.com/cacalabs/toilet
upstreams   :
    - https://github.com/cacalabs/toilet/archive/3eb9d58037afb0a1baec6dca82caa045fb2217c0.tar.gz : a16b3a6217852d4ec5e9fa94c5600b900710d652910ac041bf1c5c61524a03d4
summary     : Free replacement for FIGlet
description : |
