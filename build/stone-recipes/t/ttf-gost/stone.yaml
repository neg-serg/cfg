name        : ttf-gost
version     : "1.0"
release     : 1
homepage    : https://github.com/MishkinIN/Font_GOST_2.304
upstreams   :
    - http://127.0.0.1:8765/gost-fonts-v2.tar.gz : ef53122956b5bd786e4a3ea7d7584b621119b83fef17e875e8307ff76b9f0ddc
summary     : GOST 2.304-81 typeface (Type A and Type B)
description : |
    GOST 2.304-81 standard typeface used in engineering documentation.
    Based on the Russian state standard for technical drawings.
license     :
    - OFL-1.1
install     : |
    install -dm00755 %(installroot)%(datadir)/fonts/TTF/
    find %(workdir) -name "*.ttf" -exec install -Dm00644 {} %(installroot)%(datadir)/fonts/TTF/ \;
