name        : ttf-material-symbols-variable
version     : "4.0.0"
release     : 1
homepage    : https://github.com/google/material-design-icons
upstreams   :
    - http://127.0.0.1:8765/material-symbols-v2.tar.gz : ca4499d66f0156f2459e7d9cc981017e2b3420e9d2aa8b4ebf167748403ca2c8
summary     : Google Material Symbols variable icon font
description : |
    Google Material Symbols variable icon font with multiple styles
    (Outlined, Rounded, Sharp) and variable axes.
license     :
    - Apache-2.0
install     : |
    install -dm00755 %(installroot)%(datadir)/fonts/TTF/
    find %(workdir) -name "*.ttf" -exec install -Dm00644 {} %(installroot)%(datadir)/fonts/TTF/ \;
