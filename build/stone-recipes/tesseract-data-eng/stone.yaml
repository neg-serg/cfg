name        : tesseract-data-eng
version     : "4.1.0"
release     : 2
homepage    : https://github.com/tesseract-ocr/tessdata
summary     : Tesseract OCR eng language data
description : |
    eng language data for Tesseract OCR engine
license     : Apache-2.0
networking  : true
builddeps   :
    - binary(curl)
setup       : |
    curl -sLo eng.traineddata https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata
    sha256sum -c <<< "daa0c97d651c19fba3b25e81317cd697e9908c8208090c94c3905381c23fc047 eng.traineddata"
install     : |
    install -Dm00644 eng.traineddata %(installroot)%(datadir)/tessdata/eng.traineddata
