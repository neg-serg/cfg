name        : tesseract-data-rus
version     : "4.1.0"
release     : 2
homepage    : https://github.com/tesseract-ocr/tessdata
summary     : Tesseract OCR rus language data
description : |
    rus language data for Tesseract OCR engine
license     : Apache-2.0
networking  : true
builddeps   :
    - binary(curl)
setup       : |
    curl -sLo rus.traineddata https://github.com/tesseract-ocr/tessdata/raw/main/rus.traineddata
    sha256sum -c <<< "681be2c2bead1bc7bd235df88c44e8e60ae73ae866840c0ad4e3b4c247bd37c2 rus.traineddata"
install     : |
    install -Dm00644 rus.traineddata %(installroot)%(datadir)/tessdata/rus.traineddata
