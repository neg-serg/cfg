name        : toilet
version     : 0.3
release     : 1
homepage    : http://caca.zoy.org/wiki/toilet
summary     : The Other Implementation of figLET
description : |
    A free replacement for the FIGlet utility
license     : WTFPL
builddeps   :
    - binary(make)
    - binary(gcc)
    - pkgconfig(libcaca)
environment : |
    unset DFLAGS
    unset CFLAGS
    unset CXXFLAGS
setup       : |
    ./configure
build       : |
    %make
install     : |
    %make_install
