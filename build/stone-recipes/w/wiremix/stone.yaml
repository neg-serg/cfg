name        : wiremix
version     : "0.10.0"
release     : 1
homepage    : https://github.com/tsowell/wiremix
upstreams   :
    - https://github.com/tsowell/wiremix/archive/refs/tags/v0.10.0.tar.gz: dfb165ff664b804099c5592fd26d2b03d78e67069522bc5d3d8ef75a19505adf
summary     : WireMix - network traffic manipulation tool
description : |
    A tool for manipulating network traffic on Linux.
license     :
    - MIT
builddeps   :
    - binary(cargo)
    - binary(python3)
    - binary(make)
    - binary(gcc)
    - binary(pkg-config)
    - pkgconfig(libpipewire-0.3)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
