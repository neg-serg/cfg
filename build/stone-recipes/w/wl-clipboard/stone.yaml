name        : wl-clipboard
version     : "2.3.0"
release     : 1
homepage    : https://github.com/bugaevc/wl-clipboard
upstreams   :
    - https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.3.0.tar.gz: b4dc560973f0cd74e02f817ffa2fd44ba645a4f1ea94b7b9614dacc9f895f402
summary     : Command-line copy/paste utilities for Wayland
description : |
    Provides wl-copy and wl-paste for Wayland clipboard access.
license     :
    - GPL-3.0-only
builddeps   :
    - binary(meson)
    - binary(gcc)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
setup       : |
    %meson
build       : |
    %meson_build
install       : |
    %meson_install
