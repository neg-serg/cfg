name        : ytsurf
version     : "0.1.0"
release     : 1
homepage    : https://github.com/Stan-breaks/ytsurf
upstreams   :
    - https://github.com/Stan-breaks/ytsurf/archive/refs/heads/master.tar.gz: 77095e983b86dcb468767d42c09498a4b9ea46d1a178ea754bcc4dff0a7497e5
summary     : YouTube CLI player
description : |
    YouTube in your terminal, clean and distraction-free.
license     :
    - MIT
builddeps   :
    - binary(go)
networking  : true
build       : |
    ls *.go 2>/dev/null || echo "no Go files"
    ls go.mod 2>/dev/null || echo "no go.mod"
    GO111MODULE=off go build -o ytsurf . 2>&1 || GO111MODULE=auto go build -o ytsurf .
install     : |
    true
