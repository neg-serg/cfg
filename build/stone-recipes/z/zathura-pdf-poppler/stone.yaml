    - Zlib
builddeps   :
    - binary(meson)
    - binary(gcc)
    - pkgconfig(girara-gtk3)
    - pkgconfig(poppler)
setup       : |
    %meson
build       : |
    %meson_build
install       : |
    %meson_install
