name        : zathura-pdf-poppler
version     : "2026.05.10"
release     : 1
homepage    : https://github.com/pwmt/zathura-pdf-poppler
upstreams   :
    - https://github.com/pwmt/zathura-pdf-poppler/archive/refs/tags/2026.05.10.tar.gz: b7851748c9212083f3314f8c1f0a7ab57b64519bacc5ae9cde8b48c853cafa0b
summary     : PDF plugin for zathura
description : |
    A PDF plugin for the zathura document viewer using the poppler library.
