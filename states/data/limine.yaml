# Limine bootloader configuration
# schema_version: 1
# Used by: states/limine.sls
package: limine
source_efi: /usr/share/limine/BOOTX64.EFI
target_dir: /efi/EFI/Limine
target_efi: /efi/EFI/Limine/liminex64.efi
config_path: /efi/limine.cfg
esp_device: /dev/nvme0n1
esp_part: 5
efi_label: Limine

# UKI entries for CachyOS kernels (on ESP at /EFI/Linux/)
uki_entries:
  - name: CachyOS (linux-cachyos)
    path: EFI/Linux/arch-linux-cachyos.efi
    comment: Default CachyOS kernel with BORE scheduler
  - name: CachyOS (linux-cachyos-eevdf)
    path: EFI/Linux/arch-linux-cachyos-eevdf.efi
    comment: EEVDF scheduler variant
  - name: CachyOS (linux-cachyos-hardened)
    path: EFI/Linux/arch-linux-cachyos-hardened.efi
    comment: Hardened kernel with security mitigations
  - name: CachyOS (linux-cachyos-lts)
    path: EFI/Linux/arch-linux-cachyos-lts.efi
    comment: Long-term support kernel

fallback_entry:
  name: systemd-boot (original bootloader)
  path: EFI/systemd/systemd-bootx64.efi
  comment: Fall back to systemd-boot (Del/F2 at POST for UEFI setup)
