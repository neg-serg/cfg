name: witr
version: "0.3.2"
release: 1
homepage: https://github.com/pranshuparmar/witr
summary: A Linux CLI tool that explains the causal chain behind running processes
description: |
  A Linux CLI tool that explains the causal chain behind running processes.
license:
  - Apache-2.0
builddeps:
  - binary(wget)
networking: true
build: |
  wget -q https://github.com/pranshuparmar/witr/releases/download/v0.3.2/witr-linux-amd64
  echo "7460cfd099ff41a24a089e6f604496c22a41d4663749cb11b4014019898e16d4  witr-linux-amd64" | sha256sum -c
  mv witr-linux-amd64 witr
install: |
  %install_bin witr