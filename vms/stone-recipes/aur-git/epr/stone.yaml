name: epr
version: 0.1
release: 1
homepage: https://github.com/wustho/epr
upstreams: []
summary: CLI Epub Reader
description: |
  Terminal/CLI Epub reader written in Python 3.6
license:
  - MIT
builddeps:
  - python(poetry-core)
  - python(pip)
rundeps:
  - ncurses
networking: true
setup: |
  git clone --depth=1 https://github.com/wustho/epr.git .
build: |
  %pyproject_build
install: |
  %pyproject_install
  %python_compile
