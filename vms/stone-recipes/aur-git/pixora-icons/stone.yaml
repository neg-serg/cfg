name: pixora-icons
version: 0.1
release: 1
homepage: https://github.com/tsora1603/pixora-icons
upstreams: []
summary: 16-bit icons theme for Linux desktops
description: |
  16-bit icons theme for Linux desktops. (GIT version)
license:
  - GPL-3.0-or-later
builddeps:
  - binary(install)
networking: true
setup: |
  git clone --depth=1 https://github.com/tsora1603/pixora-icons.git .
build: |
  echo 'Data package - no build needed'
install: |
  mkdir -p %(installroot)/usr/share/icons
  cp -r pixora %(installroot)/usr/share/icons/
  cp -r pixora-dark %(installroot)/usr/share/icons/
