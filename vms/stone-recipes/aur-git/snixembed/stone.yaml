name: snixembed
version: 0.1
release: 1
homepage: https://git.sr.ht/~steef/snixembed
upstreams: []
summary: proxy StatusNotifierItems as XEmbedded systemtray icons
description: |
  Proxy StatusNotifierItems as XEmbedded systemtray-spec icons
license:
  - ISC
builddeps:
  - binary(make)
  - binary(valac)
  - binary(pkg-config)
  - vala-devel
  - glib2-devel
  - libdbusmenu-gtk3-devel
  - pkgconfig(gtk+-3.0)
  - pkgconfig(glib-2.0)
  - pkgconfig(dbusmenu-gtk3-0.4)
rundeps:
  - glib2
  - gtk-3
  - libdbusmenu-gtk3
networking: true
setup: |
  git clone --depth=1 https://git.sr.ht/~steef/snixembed .
build: |
  %make
install: |
  %make_install PREFIX=/usr
