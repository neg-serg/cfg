name        : bandwhich
version     : 0.23.1
release     : 1
homepage    : https://github.com/imsnif/bandwhich
upstreams   :
    - https://github.com/imsnif/bandwhich/archive/refs/tags/v0.23.1.tar.gz : aafb96d059cf9734da915dca4f5940c319d2e6b54e2ffb884332e9f5e820e6d7
summary     : Terminal bandwidth utilization tool
description : |
    Bandwhich sniffs a given network interface and records IP packet size
    by default, displaying it in a convenient TUI.
license     :
    - MIT
builddeps   :
    - binary(cargo)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
