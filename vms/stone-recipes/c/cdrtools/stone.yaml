name        : cdrtools
version     : "3.02a09"
release     : 1
homepage    : https://sourceforge.net/projects/cdrtools/
upstreams   :
    - https://downloads.sourceforge.net/sourceforge/cdrtools/cdrtools-3.02a09.tar.gz : c7e4f732fb299e9b5d836629dadf5512aa5e6a5624ff438ceb1d056f4dcb07c2
summary     : CD/DVD/Blu-ray burning tools
description : |
    cdrtools provides cdrecord, mkisofs, cdda2wav and other tools
    for creating and writing CD/DVD/Blu-ray media.
license     :
    - GPL-2.0-only
    - CDDL-1.0
builddeps   :
    - binary(make)
    - binary(gcc)
build       : |
    export CC=gcc
    export CFLAGS="-O2 -pipe"
    export LDFLAGS="-pipe"
    %make
install     : |
    %make_install DESTDIR=%(installroot) INS_BASE=%(prefix)
