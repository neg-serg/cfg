name: tabiew
version: "0.8.0"
release: 1
homepage: https://github.com/sxyazi/tabiew
upstreams:
  - git|https://github.com/sxyazi/tabiew:
      ref: v0.8.0
summary: A lightweight terminal-based CSV viewer
description: |
  Tabiew is a lightweight terminal-based CSV viewer
license:
  - MIT
builddeps:
  - binary(cargo)
  - pkgconfig(openssl)
networking: true
environment: |
  CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu
setup: |
  %cargo_fetch
build: |
  %cargo_build
install: |
  %cargo_install
