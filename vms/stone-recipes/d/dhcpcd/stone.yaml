name        : dhcpcd
version     : "9.5.2"
release     : 1
homepage    : https://github.com/NetworkConfiguration/dhcpcd
upstreams   :
    - https://github.com/NetworkConfiguration/dhcpcd/archive/refs/tags/v9.5.2.tar.gz : 049955b769e02e622b9a04dfbf0390d79fed3ca9dfdab58a1603aa5f02e94c78
summary     : DHCP client daemon
description : |
    dhcpcd is a DHCP client daemon for managing network configuration.
license     :
    - BSD-2-Clause
builddeps   :
    - binary(make)
    - binary(gcc)
build       : |
    ./configure --prefix=%(prefix) --sysconfdir=/etc
    %make
install     : |
    %make_install DESTDIR=%(installroot)
