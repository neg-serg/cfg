name        : doggo
version     : "1.1.7"
release     : 1
homepage    : https://github.com/mr-karan/doggo
upstreams   :
    - https://github.com/mr-karan/doggo/archive/refs/tags/v1.1.7.tar.gz : 2aca54791810246bcc90380f194c2141392f7596c5f17734a6b20bf85a3d7384
summary     : Command-line DNS client for humans
description : |
    doggo is a modern command-line DNS client written in Go. It provides
    colorful and human-readable DNS query results.
license     : GPL-3.0-only
builddeps   :
    - binary(go)
networking  : true
build       : |
    go build -o doggo ./cmd/doggo/
install     : |
    %install_bin doggo
