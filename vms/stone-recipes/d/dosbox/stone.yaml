name        : dosbox
version     : "0.74-3"
release     : 1
homepage    : https://www.dosbox.com/
upstreams   :
    - https://downloads.sourceforge.net/project/dosbox/dosbox/0.74-3/dosbox-0.74-3.tar.gz : c0d13dd7ed2ed363b68de615475781e891cd582e8162b5c3669137502222260a
summary     : DOS emulator
description : |
    DOSBox is a DOS-emulator that uses the SDL library.
license     :
    - GPL-2.0-only
builddeps   :
    - binary(make)
    - binary(gcc)
    - binary(g++)
    - pkgconfig(sdl2)
setup       : |
    %configure --disable-sdlnet
build       : |
    %make
install     : |
    %make_install
