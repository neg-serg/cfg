name        : dualsensectl
version     : "0.7"
release     : 1
homepage    : https://github.com/nowrep/dualsensectl
upstreams   :
    - https://github.com/nowrep/dualsensectl/archive/refs/tags/v0.7.tar.gz : a615304596925738b12d0a499f31e1fe0cc3653da230edfe7c68637098ce6b72
summary     : Linux command-line utility for DualSense controllers
description : |
    dualsensectl is a command-line utility for controlling Sony DualSense
    controllers on Linux. It can set LED color, lightbar, and other features.
license     : GPL-2.0-only
builddeps   :
    - binary(meson)
    - binary(gcc)
    - binary(ninja)
    - pkgconfig(sdl2)
    - pkgconfig(libudev)
    - pkgconfig(dbus-1)
    - pkgconfig(hidapi-hidraw)
setup       : |
    %meson
build       : |
    %ninja
install     : |
    %ninja_install
