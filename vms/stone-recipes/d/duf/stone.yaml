name        : duf
version     : "0.9.1"
release     : 1
homepage    : https://github.com/muesli/duf
upstreams   :
    - https://github.com/muesli/duf/archive/refs/tags/v0.9.1.tar.gz : 1334d8c1a7957d0aceebe651e3af9e1c1e0c6f298f1feb39643dd0bd8ad1e955
summary     : Disk Usage/Free Utility
description : |
    duf is a disk usage/free utility that provides a user-friendly overview
    of disk usage with colorful output.
license     : MPL-2.0
builddeps   :
    - binary(go)
networking  : true
build       : |
    go build -o duf .
install     : |
    %install_bin duf
