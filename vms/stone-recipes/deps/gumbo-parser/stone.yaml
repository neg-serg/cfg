name: gumbo-parser
version: "0.10.1"
release: 1
homepage: https://github.com/google/gumbo-parser
upstreams:
  - https://github.com/google/gumbo-parser/archive/refs/tags/v0.10.1.tar.gz : 28463053d44a5dfbc4b77bcf49c8cee119338ffa636cc17fc3378421d714efad
summary: HTML5 parsing library in C99
description: |
  Gumbo is an implementation of the HTML5 parsing algorithm
license:
  - Apache-2.0
builddeps:
  - binary(make)
  - binary(gcc)
  - binary(autoconf)
  - binary(automake)
  - binary(libtool)
setup: |
  ./autogen.sh
  %configure
build: |
  %make
install: |
  %make_install
