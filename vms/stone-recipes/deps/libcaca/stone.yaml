name: libcaca
version: "0.99.beta20"
release: 1
homepage: https://github.com/cacalabs/libcaca
upstreams:
  - https://github.com/cacalabs/libcaca/archive/refs/tags/v0.99.beta20.tar.gz : 3edb8763a8f888ed4d4b85b3a056e81c840d5d27f79bdebc0b991688b23084f2
summary: Colour ASCII-Art library
description: |
  libcaca is a library that converts images into ASCII art
license:
  - WTFPL
builddeps:
  - binary(make)
  - binary(gcc)
  - binary(autoconf)
  - binary(automake)
  - binary(libtool)
  - ncurses-devel
setup: |
  ./bootstrap
  %configure --disable-doc --disable-ruby --disable-python --disable-java --disable-csharp
build: |
  make -j"%(jobs)" -C caca
  make -j"%(jobs)" -C cxx
install: |
  make -C caca install DESTDIR="%(installroot)"
  make -C cxx install DESTDIR="%(installroot)"
