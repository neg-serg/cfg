name: droidcam
version: "2.1.5"
release: 1
homepage: https://www.dev47apps.com/
upstreams:
  - https://github.com/dev47apps/droidcam-linux-client/releases/download/v2.1.5/droidcam_2.1.5.zip : ab2e5375c4b496ee7eca65e221c35d50e3cc27f75b195c2ab563e815d10dbab1
summary: Use your phone as a webcam
description: |
  DroidCam turns your phone into a webcam for Linux.
license:
  - GPL-2.0-only
install: |
  bsdtar xf /mason/sourcedir/droidcam_2.1.5.zip -C .
  install -Dm00755 droidcam %(installroot)%(bindir)/droidcam
  install -Dm00755 droidcam-cli %(installroot)%(bindir)/droidcam-cli

  mkdir -p %(installroot)%(datadir)/applications
  install -Dm00644 droidcam.desktop %(installroot)%(datadir)/applications/droidcam.desktop

  mkdir -p %(installroot)%(datadir)/icons/hicolor/256x256/apps
  install -Dm00644 icon2.png %(installroot)%(datadir)/icons/hicolor/256x256/apps/droidcam.png
