name        : entr
version     : "5.8"
release     : 1
homepage    : https://github.com/eradman/entr
upstreams   :
    - https://github.com/eradman/entr/archive/refs/tags/5.8.tar.gz : dc9a2bdc556b2be900c1d8cdf432de26492de5af3ffade000d4bfd97f3122bfb
summary     : Run arbitrary commands when files change
description : |
    entr (Event Notification Tool for files) runs arbitrary commands
    when files change. It uses kqueue(2) or inotify(7) to avoid polling.
license     :
    - ISC
builddeps   :
    - binary(cc)
    - binary(make)
setup       : |
    ./configure
build       : |
    %make PREFIX=%(prefix)
install     : |
    %make_install PREFIX=%(prefix) DESTDIR=%(installroot)
