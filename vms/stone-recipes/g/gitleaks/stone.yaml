name: gitleaks
version: "8.30.1"
release: 1
homepage: https://github.com/gitleaks/gitleaks
upstreams:
  - https://github.com/gitleaks/gitleaks/archive/refs/tags/v8.30.1.tar.gz : e90fb266d75837e75894c778bf594ab8e2787f12dce5a62651f21b893eaf9abb
summary: Scan git repos for secrets
description: |
  Gitleaks is a SAST tool for detecting hardcoded secrets like passwords, api keys, and tokens in git repos.
license:
  - MIT
builddeps:
  - binary(go)
networking: true
setup: |
  go mod download
build: |
  go build -o gitleaks .
install: |
  %install_bin gitleaks
