name        : handlr-regex
version     : "0.13.0"
release     : 1
homepage    : https://github.com/Anomalocaridid/handlr-regex
upstreams   :
    - https://github.com/Anomalocaridid/handlr-regex/archive/refs/tags/v0.13.0.tar.gz : 963126a7aa8277b7cc7886c518528473ce5117a5999c949b809e14beffdbad0d
summary     : Manage default applications with regex support
description : |
    Fork of handlr with support for regex-based application handling.
license     :
    - MIT
builddeps   :
    - binary(cargo)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    install -Dm00755 target/x86_64-unknown-linux-gnu/release/handlr %(installroot)/usr/bin/handlr
