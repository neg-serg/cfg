name        : hashcat
version     : "7.1.2"
release     : 1
homepage    : https://github.com/hashcat/hashcat
upstreams   :
    - https://github.com/hashcat/hashcat/archive/refs/tags/v7.1.2.tar.gz : 9546a6326d747530b44fcc079babad40304a87f32d3c9080016d58b39cfc8b96
summary     : Worlds fastest password recovery utility
description : |
    hashcat is the worlds fastest and most advanced password recovery utility.
license     :
    - MIT
builddeps   :
    - binary(make)
    - binary(clang)
    - binary(clang++)
    - binary(ar)
build       : |
    make -j$(nproc) CC=clang CXX=clang++ AR=llvm-ar
install     : |
    install -Dm00755 hashcat %(installroot)/usr/bin/hashcat
    install -Dm00644 hashcat.hcstat2 %(installroot)/usr/share/hashcat/hashcat.hcstat2
    install -d %(installroot)/usr/share/hashcat/modules
    install -m00755 modules/module_*.so %(installroot)/usr/share/hashcat/modules/
    install -d %(installroot)/usr/share/hashcat/OpenCL
    cp -a OpenCL/* %(installroot)/usr/share/hashcat/OpenCL/
    install -d %(installroot)/usr/share/doc/hashcat
    cp -a charsets/* %(installroot)/usr/share/doc/hashcat/charsets/ 2>/dev/null || true
    cp -a docs/* %(installroot)/usr/share/doc/hashcat/docs/ 2>/dev/null || true
    cp -a layouts/* %(installroot)/usr/share/doc/hashcat/layouts/ 2>/dev/null || true
    cp -a masks/* %(installroot)/usr/share/doc/hashcat/masks/ 2>/dev/null || true
    cp -a rules/* %(installroot)/usr/share/doc/hashcat/rules/ 2>/dev/null || true
    cp -a extra/* %(installroot)/usr/share/doc/hashcat/extra/ 2>/dev/null || true
