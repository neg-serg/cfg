name        : hyprpicker
version     : 0.4.7
release     : 1
homepage    : https://github.com/hyprwm/hyprpicker
upstreams   :
    - https://github.com/hyprwm/hyprpicker/archive/refs/tags/v0.4.7.tar.gz : cde02b92abe372187c9d59a7cb2ca07ede5c3e1a8c81ed8b209dc0d3ac5f0339
summary     : A wlroots-compatible Wayland color picker
description : |
    A wlroots-compatible Wayland color picker that does not suck.
license     :
    - BSD-3-Clause
builddeps   :
    - binary(cmake)
    - binary(clang)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - pkgconfig(xkbcommon)
    - pkgconfig(cairo)
    - pkgconfig(pango)
    - pkgconfig(pangocairo)
    - pkgconfig(libjpeg)
    - pkgconfig(hyprutils)
    - pkgconfig(hyprwayland-scanner)
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
