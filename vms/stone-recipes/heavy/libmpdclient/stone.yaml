name        : libmpdclient
version     : "2.22"
release     : 1
homepage    : https://www.musicpd.org/libs/libmpdclient/
upstreams   :
    - https://github.com/MusicPlayerDaemon/libmpdclient/archive/refs/tags/v2.22.tar.gz : 56bbae543a8a70db83b68c679b91990838f0db31a358c1a139774cd8ba7e3c59
summary     : Client library for MPD
description : |
    libmpdclient is a C library for communicating with MPD (Music Player Daemon).
license     : BSD-3-Clause
builddeps   :
    - binary(meson)
    - binary(gcc)
    - binary(g++)
    - binary(ninja)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
