name        : libvterm
version     : "0.3.3"
release     : 1
homepage    : https://github.com/neovim/libvterm
upstreams   :
    - https://github.com/neovim/libvterm/archive/refs/tags/v0.3.3.tar.gz : 0babe3ab42c354925dadede90d352f054aa9c4ae6842ea803a20c9741e172e56
summary     : Terminal emulator library
description : |
    A library for terminal emulation
license     : MIT
builddeps   :
    - binary(make)
    - binary(gcc)
    - binary(libtool)
    - binary(perl)
build       : |
    make -j "%(jobs)" PREFIX=%(prefix) LDFLAGS="-L." libvterm.la
install     : |
    make install-lib install-inc PREFIX=%(prefix) DESTDIR="%(installroot)"
