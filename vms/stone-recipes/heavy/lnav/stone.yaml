name        : lnav
version     : "0.14.0"
release     : 1
homepage    : https://lnav.org
upstreams   :
    - https://github.com/tstack/lnav/archive/refs/tags/v0.14.0.tar.gz : bf142441fc85e99c256ebe661e4199768acbd340da1344554da49a9e867a49ea
summary     : Log file navigator
description : |
    lnav is an advanced log file viewer for the small-scale.
license     : BSD-2-Clause
builddeps   :
    - binary(cmake)
    - binary(gcc)
    - binary(g++)
    - binary(make)
    - name(libunistring-devel)
    - binary(cargo)
    - binary(rustc)
    - binary(cargo)
    - binary(rustc)
    - pkgconfig(sqlite3)
    - pkgconfig(ncurses)
    - pkgconfig(readline)
    - pkgconfig(zlib)
    - pkgconfig(libarchive)
    - pkgconfig(libcurl)
    - pkgconfig(bzip2)
    - pkgconfig(libpcre2-8)
    - pkgconfig(libpcre2-16)
    - pkgconfig(libpcre2-32)
    - pkgconfig(libpcre2-posix)
setup : |
    UNISTRING_LIBS="-lunistring"
    sed -i 's|\${VCPKG_INSTALLED_DIR}/\${VCPKG_TARGET_TRIPLET}/lib/libunistring.a|'"$UNISTRING_LIBS"'|' CMakeLists.txt
    mkdir -p cmake-config
    SQLITE3_INC="$(pkg-config --cflags-only-I sqlite3 | sed 's/-I//g')"
    cat > cmake-config/unofficial-sqlite3Config.cmake << 'CEOF'
    add_library(unofficial::sqlite3::sqlite3 UNKNOWN IMPORTED)
    set_target_properties(unofficial::sqlite3::sqlite3 PROPERTIES
        INTERFACE_INCLUDE_DIRECTORIES "SQLITE3_INC_PLACEHOLDER"
        IMPORTED_LOCATION "/usr/lib/libsqlite3.so"
    )
    CEOF
    sed -i "s|SQLITE3_INC_PLACEHOLDER|$SQLITE3_INC|g" cmake-config/unofficial-sqlite3Config.cmake
    PCRE2_8_INC="$(pkg-config --cflags-only-I libpcre2-8 | sed 's/-I//g')"
    PCRE2_16_INC="$(pkg-config --cflags-only-I libpcre2-16 | sed 's/-I//g')"
    PCRE2_32_INC="$(pkg-config --cflags-only-I libpcre2-32 | sed 's/-I//g')"
    PCRE2_POSIX_INC="$(pkg-config --cflags-only-I libpcre2-posix | sed 's/-I//g')"
    cat > cmake-config/pcre2Config.cmake << 'CEOF'
    add_library(PCRE2::8BIT UNKNOWN IMPORTED)
    set_target_properties(PCRE2::8BIT PROPERTIES
        INTERFACE_INCLUDE_DIRECTORIES "PCRE2_8_INC_PLACEHOLDER"
        IMPORTED_LOCATION "/usr/lib/libpcre2-8.so"
    )
    add_library(PCRE2::16BIT UNKNOWN IMPORTED)
    set_target_properties(PCRE2::16BIT PROPERTIES
        INTERFACE_INCLUDE_DIRECTORIES "PCRE2_16_INC_PLACEHOLDER"
        IMPORTED_LOCATION "/usr/lib/libpcre2-16.so"
    )
    add_library(PCRE2::32BIT UNKNOWN IMPORTED)
    set_target_properties(PCRE2::32BIT PROPERTIES
        INTERFACE_INCLUDE_DIRECTORIES "PCRE2_32_INC_PLACEHOLDER"
        IMPORTED_LOCATION "/usr/lib/libpcre2-32.so"
    )
    add_library(PCRE2::POSIX UNKNOWN IMPORTED)
    set_target_properties(PCRE2::POSIX PROPERTIES
        INTERFACE_INCLUDE_DIRECTORIES "PCRE2_POSIX_INC_PLACEHOLDER"
        IMPORTED_LOCATION "/usr/lib/libpcre2-posix.so"
    )
    CEOF
    sed -i "s|PCRE2_8_INC_PLACEHOLDER|$PCRE2_8_INC|g; s|PCRE2_16_INC_PLACEHOLDER|$PCRE2_16_INC|g; s|PCRE2_32_INC_PLACEHOLDER|$PCRE2_32_INC|g; s|PCRE2_POSIX_INC_PLACEHOLDER|$PCRE2_POSIX_INC|g" cmake-config/pcre2Config.cmake
    # Pre-create valid config.h and config.h.in (cmake will overwrite config.h later)
    cat > src/config.h.in << 'CEOF'
    #define HAVE_PCRE_H
    #define HAVE_CURSES_H
    #define HAVE_ARCHIVE_H 1
    #define HAVE_BZLIB_H 1
    #define HAVE_LIBCURL
    #define SIZEOF_OFF_T 8
    #define PACKAGE "lnav"
    #define VCS_PACKAGE_STRING "lnav 0.14.0"
    #define PACKAGE_VERSION "0.14.0"
    #define PACKAGE_URL "https://lnav.org/"
    #define HAVE_PTY_H
    #define HAVE_UTIL_H
    #define HAVE_EXECINFO_H
    /* #undef HAVE_LIBPROC_H */
    #define HAVE_SQLITE3_STMT_READONLY
    #define HAVE_SQLITE3_VALUE_SUBTYPE
    #define HAVE_SQLITE3_ERROR_OFFSET
    #define HAVE_SQLITE3_DROP_MODULES
    #define _XOPEN_SOURCE_EXTENDED 1
    #define PACKAGE_BUGREPORT "lnav@googlegroups.com"
    #define HAVE_RUST_DEPS 1
    CEOF
    cp src/config.h.in src/config.h
    %cmake -DCMAKE_PREFIX_PATH="$(pwd)/cmake-config" -Dpcre2_DIR="$(pwd)/cmake-config" -Dunofficial-sqlite3_DIR="$(pwd)/cmake-config" -DCMAKE_SKIP_INSTALL_ALL_DEPENDENCY=ON
build : |
    %cmake_build
install : |
    %cmake_install
