name        : mpdas
version     : "0.4.5"
release     : 1
homepage    : https://github.com/hnarayanan/mpdas
upstreams   :
    - https://github.com/hnarayanan/mpdas/archive/refs/tags/0.4.5.tar.gz :
summary     : Audio Scrobbler for MPD
description : |
    mpdas is an Audio Scrobbler client for MPD written in C++.
license     : MIT
builddeps   :
    - binary(g++)
    - binary(make)
    - pkgconfig(libmpdclient)
    - pkgconfig(libcurl)
setup       : |
    echo "no configure needed"
build       : |
    %make
install     : |
    install -D -m 755 mpdas -t "%(installroot)/usr/bin/"
    install -D -m 644 mpdasrc.example -t "%(installroot)/etc/"
