name        : nmap
version     : "7.95"
release     : 1
homepage    : https://nmap.org
upstreams   :
    - https://nmap.org/dist/nmap-7.95.tar.bz2 : e14ab530e47b5afd88f1c8a2bac7f89cd8fe6b478e22d255c5b9bddb7a1c5778
summary     : Network exploration and security auditing utility
description : |
    Nmap is a utility for network discovery and security auditing.
license     : NPSL
builddeps   :
    - binary(cat)
    - binary(rm)
    - binary(sort)
    - binary(sed)
    - binary(expr)
    - binary(gcc)
    - binary(g++)
    - binary(make)
    - binary(ar)
    - binary(aclocal)
    - binary(autoconf)
    - binary(perl)
    - binary(m4)
    - pkgconfig(libpcap)
    - pkgconfig(openssl)
    - pkgconfig(zlib)
setup       : |
    %configure --without-zenmap --without-nmap-update --with-liblua=included
    touch libpcre/aclocal.m4 libpcre/configure libdnet-stripped/aclocal.m4 libdnet-stripped/configure liblinear/aclocal.m4 liblinear/configure libssh2/aclocal.m4 libssh2/configure 2>/dev/null || true
build       : |
    %make ACLOCAL=true AUTOMAKE=true AUTOCONF=true AUTOHEADER=true -j4
install       : |
    %make_install
