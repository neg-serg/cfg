name        : ioping
version     : "1.3"
release     : 1
homepage    : https://github.com/koct9i/ioping
upstreams   :
    - https://github.com/koct9i/ioping/archive/refs/tags/v1.3.tar.gz : 7aa48e70aaa766bc112dea57ebbe56700626871052380709df3a26f46766e8c8
summary     : I/O latency measurement tool
description : |
    Simple I/O latency measurement tool for storage devices.
license     :
    - GPL-3.0-only
builddeps   :
    - binary(clang)
    - binary(make)
build       : |
    make -j$(nproc) CC=clang
install     : |
    install -Dm00755 ioping %(installroot)/usr/bin/ioping
