name        : jdupes
version     : "1.31.1"
release     : 1
homepage    : https://codeberg.org/jbruchon/jdupes
upstreams   :
    - https://codeberg.org/jbruchon/jdupes/archive/v1.31.1.tar.gz : c80d4c1deb03cc891a7e938f886952cfc480b8a0bc48baf21b312d350b62d8e3
    - https://codeberg.org/jbruchon/libjodycode/archive/v4.1.2.tar.gz : a7085da591e0c314eb3442e7b258a6b6944e6978ecb2764ab33f3cb840f47ff4
summary     : Duplicate file finder
description : |
    A program for identifying duplicate files residing within specified directories.
license     :
    - MIT
builddeps   :
    - binary(clang)
    - binary(make)
setup       : |
    mkdir -p libjodycode_src
    bsdtar-static xf %(sourcedir)/v4.1.2.tar.gz -C libjodycode_src --strip-components=1 --no-same-owner
    make -C libjodycode_src -j$(nproc) CC=clang PREFIX=/usr
    cp libjodycode_src/libjodycode.h .
build       : |
    make -j$(nproc) CC=clang CFLAGS="-I. -Ilibjodycode_src" LDFLAGS="-Llibjodycode_src"
install     : |
    make install PREFIX=/usr DESTDIR=%(installroot)
