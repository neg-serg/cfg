name        : lnav
version     : "0.14.0"
release     : 1
homepage    : https://github.com/tstack/lnav
upstreams   :
    - https://github.com/tstack/lnav/archive/refs/tags/v0.14.0.tar.gz : bf142441fc85e99c256ebe661e4199768acbd340da1344554da49a9e867a49ea
summary     : Log file navigator
description : |
    lnav is a log file navigator with advanced search and filtering.
license     : BSD-2-Clause
builddeps   :
    - binary(cmake)
    - binary(gcc)
    - binary(g++)
    - curl-devel
    - pkgconfig(ncursesw)
    - pkgconfig(libpcre2-8)
    - pkgconfig(sqlite3)
    - pkgconfig(zlib)
    - pkgconfig(bzip2)
    - pkgconfig(libarchive)
setup       : |
    mkdir -p '%(workdir)/cmake_modules'
    printf 'add_library(unofficial::sqlite3::sqlite3 UNKNOWN IMPORTED)\nset_target_properties(unofficial::sqlite3::sqlite3 PROPERTIES\n    IMPORTED_LOCATION "/usr/lib/libsqlite3.so"\n    INTERFACE_INCLUDE_DIRECTORIES "/usr/include"\n)\n' > '%(workdir)/cmake_modules/unofficial-sqlite3-config.cmake'
    printf 'add_library(PCRE2::8BIT UNKNOWN IMPORTED)\nset_target_properties(PCRE2::8BIT PROPERTIES\n    IMPORTED_LOCATION "/usr/lib/libpcre2-8.so"\n    INTERFACE_INCLUDE_DIRECTORIES "/usr/include"\n)\nadd_library(PCRE2::16BIT UNKNOWN IMPORTED)\nset_target_properties(PCRE2::16BIT PROPERTIES\n    IMPORTED_LOCATION "/usr/lib/libpcre2-16.so"\n    INTERFACE_INCLUDE_DIRECTORIES "/usr/include"\n)\nadd_library(PCRE2::32BIT UNKNOWN IMPORTED)\nset_target_properties(PCRE2::32BIT PROPERTIES\n    IMPORTED_LOCATION "/usr/lib/libpcre2-32.so"\n    INTERFACE_INCLUDE_DIRECTORIES "/usr/include"\n)\nadd_library(PCRE2::POSIX UNKNOWN IMPORTED)\nset_target_properties(PCRE2::POSIX PROPERTIES\n    IMPORTED_LOCATION "/usr/lib/libpcre2-posix.so"\n    INTERFACE_INCLUDE_DIRECTORIES "/usr/include"\n)\n' > '%(workdir)/cmake_modules/pcre2-config.cmake'
    %cmake -Dpcre2_DIR=%(workdir)/cmake_modules -Dunofficial-sqlite3_DIR=%(workdir)/cmake_modules
build       : |
    %cmake_build
install     : |
    %cmake_install
