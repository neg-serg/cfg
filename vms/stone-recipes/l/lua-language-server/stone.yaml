name        : lua-language-server
version     : "3.18.2"
release     : 1
homepage    : https://github.com/LuaLS/lua-language-server
upstreams   :
    - https://github.com/LuaLS/lua-language-server/archive/refs/tags/3.18.2.tar.gz : fa561fad84fe44f6e0fda2eabef6b133464a324a67a57a7d5a9a89dcb7722519
summary     : Lua language server
description : |
    Sumneko's Lua language server.
license     : MIT
builddeps   :
    - binary(gcc)
    - binary(g++)
    - binary(make)
build       : |
    make -j$(nproc)
install     : |
    install -Dm755 bin/lua-language-server %(installroot)%(prefix)/bin/lua-language-server; cp -r locale meta script %(installroot)%(prefix)/share/lua-language-server/ 2>/dev/null || true
