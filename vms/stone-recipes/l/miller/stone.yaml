name        : miller
version     : "6.13.0"
release     : 1
homepage    : https://github.com/johnkerl/miller
upstreams   :
    - https://github.com/johnkerl/miller/archive/refs/tags/v6.13.0.tar.gz : 6beca48af3066fc8d87c3ce17c5dd3debac61ff8f296c0e95c0634fd3ab05599
summary     : CSV/JSON processing tool
description : |
    miller is like sed/awk/cut/join for CSV, JSON and other structured data formats.
license     : BSD-2-Clause
builddeps   :
    - binary(go)
networking  : true
build       : |
    go build -o miller ./cmd/mlr
install     : |
    %install_bin miller
