name        : minicom
version     : "2.9"
release     : 1
homepage    : https://salsa.debian.org/minicom-team/minicom
upstreams   :
    - https://salsa.debian.org/minicom-team/minicom/-/archive/2.9/minicom-2.9.tar.gz : 21e609d1b58c5de06400f6e36ed3a5060711847a63bc984b6e994d9ad1641d37
summary     : Serial communication terminal
description : |
    minicom is a serial communication terminal program.
license     : GPL-2.0-only
builddeps   :
    - binary(make)
    - binary(gcc)
    - pkgconfig(ncurses)
setup       : |
    ./configure --prefix=%(prefix) --sysconfdir=%(prefix)/etc --enable-lock-dir=/tmp --disable-lockdev
build       : |
    %make
install     : |
    %make_install
