name: mpd
version: "0.23.17"
release: 1
homepage: https://www.musicpd.org/
upstreams:
  - https://github.com/MusicPlayerDaemon/MPD/archive/refs/tags/v0.23.17.tar.gz : 6fcdc5db284297150734afd9b3d1a5697a29f6297eff1b56379018e31d023838
summary: Music Player Daemon
description: |
  MPD is a flexible, powerful, server-side application for playing music.
license:
  - GPL-2.0-or-later
builddeps:
  - binary(meson)
  - binary(gcc)
  - binary(g++)
  - pkgconfig(glib-2.0)
  - pkgconfig(sqlite3)
  - pkgconfig(zlib)
  - pkgconfig(icu-uc)
  - pkgconfig(expat)
  - pkgconfig(fmt)
  - boost-devel
setup: |
  %meson -Dalsa=disabled -Dpipewire=disabled -Dpulse=disabled -Djack=disabled \
         -Dsndio=disabled -Drecorder=false -Dfaad=disabled \
         -Dflac=disabled -Dwavpack=disabled -Dmad=disabled -Dmpg123=disabled \
         -Dvorbis=disabled -Dopus=disabled -Dcurl=disabled -Dnfs=disabled \
         -Dsmbclient=disabled -Dupnp=disabled -Dneighbor=false \
         -Dsqlite=enabled -Dhttpd=true -Dfifo=true -Ddatabase=true \
         -Dlibmpdclient=disabled -Dzlib=enabled -Dicu=enabled -Dexpat=enabled
build: |
  %meson_build
install: |
  %meson_install
