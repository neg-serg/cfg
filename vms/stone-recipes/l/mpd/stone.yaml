name        : mpd
version     : "0.23.17"
release     : 1
homepage    : https://www.musicpd.org/
upstreams   :
    - https://github.com/MusicPlayerDaemon/MPD/archive/refs/tags/v0.23.17.tar.gz : 6fcdc5db284297150734afd9b3d1a5697a29f6297eff1b56379018e31d023838
summary     : Music Player Daemon
description : |
    Music Player Daemon (MPD) is a flexible, powerful server-side application for playing music.
license     : GPL-2.0-only
builddeps   :
    - binary(meson)
    - binary(gcc)
    - binary(g++)
    - pkgconfig(glib-2.0)
    - pkgconfig(gio-2.0)
    - pkgconfig(sqlite3)
    - pkgconfig(ogg)
    - pkgconfig(vorbis)
    - pkgconfig(flac)
    - pkgconfig(zlib)
    - pkgconfig(bzip2)
    - pkgconfig(pcre2)
setup       : |
    meson setup build --prefix=%(prefix)
build       : |
    meson compile -C build
install     : |
    meson install -C build --destdir %(installroot)
