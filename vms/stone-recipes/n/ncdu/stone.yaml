name        : ncdu
version     : "1.8"
release     : 1
homepage    : https://github.com/rofl0r/ncdu
upstreams   :
    - https://github.com/rofl0r/ncdu/archive/refs/tags/v1.8.tar.gz : e99fccfb69ab75cadeea48f034730db30c21d7b9a23293671a641b219404c8fa
summary     : NCurses Disk Usage
description : |
    ncdu (NCurses Disk Usage) is a disk usage analyzer with an ncurses
    interface. It provides a fast way to see which directories are using
    your disk space.
license     : MIT
builddeps   :
    - binary(make)
    - binary(gcc)
    - ncurses-devel
    - autoconf
    - automake
setup       : |
    autoreconf -fi
    %configure
build       : |
    %make
install     : |
    %make_install
