name        : noto-fonts-emoji
version     : "2.051"
release     : 1
homepage    : https://github.com/googlefonts/noto-emoji
upstreams   :
    - http://127.0.0.1:8765/noto-emoji-v2.tar.gz : c0e3793bbbcb18ee956f90d136cf3c30620d82913d3b5a2d3e6045b849ed80a9
summary     : Google Noto Color Emoji font
description : |
    Google Noto Color Emoji font providing color emoji glyphs.
license     :
    - OFL-1.1
install     : |
    install -dm00755 %(installroot)%(datadir)/fonts/TTF/
    find %(workdir) -name "*.ttf" -exec install -Dm00644 {} %(installroot)%(datadir)/fonts/TTF/ \;
