name        : noto-fonts
version     : "1.0"
release     : 1
homepage    : https://fonts.google.com/noto
upstreams   :
    - https://github.com/notofonts/NotoSans/archive/refs/heads/main.tar.gz : 02ed1f0f7604784f4f6f5bc06f69e2218a5be9f681c5d664fe77a5821ee53f22
    - https://github.com/notofonts/NotoSerif/archive/refs/heads/main.tar.gz : cd4b2d327b6a28e3953432fa4a02a5215d9122227f56a898fca41eb36d710faa
    - https://github.com/notofonts/NotoSansMono/archive/refs/heads/main.tar.gz : 7327985498bb289c17d3f7ea77c6ca267a551dfff5217534af75b16a7c012bd4
summary     : Google Noto fonts (Sans, Serif, Mono)
description : |
    Google Noto fonts for Latin, Greek, and Cyrillic scripts.
    Includes Noto Sans, Noto Serif, and Noto Sans Mono families.
license     :
    - OFL-1.1
install     : |
    install -dm00755 %(installroot)%(datadir)/fonts/TTF/
    find %(workdir) -name "*.ttf" -exec install -Dm00644 {} %(installroot)%(datadir)/fonts/TTF/ \;
