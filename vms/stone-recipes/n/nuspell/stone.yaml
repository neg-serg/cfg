name        : nuspell
version     : "5.1.7"
release     : 1
homepage    : https://github.com/nuspell/nuspell
upstreams   :
    - https://github.com/nuspell/nuspell/archive/refs/tags/v5.1.7.tar.gz : 9aee944e86924ce44434741cb950fee8f9a6ff9c4f002803ab5f04698c8e4c68
summary     : Spell checker for spellchecking
description : |
    Nuspell is a fast and safe spell checker designed for
    spellchecking. It is the successor of MySpell.
license     : LGPL-3.0-only
builddeps   :
    - binary(cmake)
    - binary(gcc)
    - binary(g++)
    - icu-devel
setup       : |
    %cmake -DBUILD_TESTING=OFF -DBUILD_DOCS=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
