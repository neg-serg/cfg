name        : onefetch
version     : "2.27.1"
release     : 1
homepage    : https://github.com/o2sh/onefetch
upstreams   :
    - https://github.com/o2sh/onefetch/archive/refs/tags/2.27.1.tar.gz : 3a6f82d3da4da62b2e5406bbe307b0afc73cd8fcc4855534886d80ea0121cc03
summary     : Command-line Git information tool
description : |
    onefetch is a command-line Git information tool that displays
    project information and code statistics for a local Git repository.
license     : MIT
builddeps   :
    - binary(cargo)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
