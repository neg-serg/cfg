name: pbzip2
version: "1.1.13"
release: 1
homepage: https://launchpad.net/pbzip2
upstreams:
  - https://launchpad.net/pbzip2/1.1/1.1.13/+download/pbzip2-1.1.13.tar.gz : 8fd13eaaa266f7ee91f85c1ea97c86d9c9cc985969db9059cdebcb1e1b7bdbe6
summary: Parallel bzip2 compression utility
description: |
  pbzip2 is a parallel implementation of bzip2
license:
  - BSD-3-Clause
builddeps:
  - binary(make)
  - binary(gcc)
  - binutils
  - bzip2-devel
build: |
  make
install: |
  make install PREFIX=%(prefix) DESTDIR=%(installroot)
