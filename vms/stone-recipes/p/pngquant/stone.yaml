name: pngquant
version: "3.0.3"
release: 1
homepage: https://pngquant.org
upstreams:
  - https://github.com/kornelski/pngquant/archive/refs/tags/3.0.3.tar.gz : ddd8889a9c269ba454d0c5e4f7167948d55d77c4570b23f671809fd3a68b6822
summary: pngquant
description: |
  pngquant for AerynOS.
license:
  - GPL-3.0-only
builddeps:
  - binary(make)
  - binary(gcc)
  - libpng-devel
  - zlib-devel
networking: true

build: |
  make
install: |
  install -Dm0755 pngquant %(installroot)/%(prefix)/bin/pngquant
