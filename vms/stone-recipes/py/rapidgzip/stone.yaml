name        : python-rapidgzip
version     : "0.16.0"
release     : 1
homepage    : https://pypi.org/project/rapidgzip
upstreams   :
    - https://pypi.debian.net/rapidgzip/rapidgzip-0.16.0.tar.gz : 8b124f29bc12de4249ab81e83e5ad35e67742a1a8ff4acb61b74c0d9fda1c14e
summary     : Parallel random access to gzip files
description : |
    Parallel random access to gzip files
license     :
    - MIT
builddeps   :
    - python(setuptools)
    - python(wheel)
    - python(cython)
rundeps     :
    - python-libs
build       : |
    sed -i "s/setuptools.*< 72/setuptools >= 61.2/" pyproject.toml
    %pyproject_build
install     : |
    %pyproject_install
    %python_compile
