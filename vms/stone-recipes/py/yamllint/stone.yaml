name: python-yamllint
version: '1.38.0'
release: 1
homepage: https://github.com/adrienverge/yamllint
upstreams:
  - https://files.pythonhosted.org/packages/28/a0/8fc2d68e132cf918f18273fdc8a1b8432b60d75ac12fdae4b0ef5c9d2e8d/yamllint-1.38.0.tar.gz : '09e5f29531daab93366bb061e76019d5e91691ef0a40328f04c927387d1d364d'
summary: Linter for YAML files
description: |
  yamllint checks YAML files for syntax validity, key repetition, and cosmetic problems such as line length, trailing spaces, and indentation.
license:
  - GPL-3.0-or-later
builddeps:
  - python(setuptools)
  - binary(python3)
rundeps:
  - python-libs
  - python-pyyaml
build: |
  %pyproject_build
install: |
  %pyproject_install
  %python_compile
