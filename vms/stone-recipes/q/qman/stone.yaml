name        : qman
version     : "1.5.1"
release     : 1
homepage    : https://github.com/plp13/qman
upstreams   :
    - https://github.com/plp13/qman/archive/refs/tags/v1.5.1.tar.gz : e550958523d0fef90fd0123a61a8f10099ed0c9735e06d8152662d8965b5a0e1
summary     : Qt-based man page viewer
description : |
    QMan is a Qt-based offline documentation browser for man pages.
license     :
    - GPL-3.0-or-later
builddeps   :
    - binary(meson)
    - binary(gcc)
    - binary(g++)
    - qt5-base-devel
setup       : |
    %meson
build       : |
    %meson_build
install       : |
    %meson_install
