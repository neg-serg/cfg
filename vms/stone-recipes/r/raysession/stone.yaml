name        : raysession
version     : "0.9.2"
release     : 1
homepage    : https://github.com/Houston4444/RaySession
upstreams   :
    - https://github.com/Houston4444/RaySession/archive/refs/tags/v0.9.2.tar.gz : 402355fff302fe6af2a3e278a2902ebd0a0fd8585533b20657bb1f7a60fa89fc
summary     : Session manager for audio applications
description : |
    RaySession is a session manager for audio applications following
    the NSM (Non Session Manager) protocol.
license     :
    - GPL-3.0-or-later
builddeps   :
    - binary(qmake)
    - binary(gcc)
    - binary(g++)
    - qt5-base-devel
    - qt5-tools-devel
setup       : |
    qmake
build       : |
    %make
install       : |
    %make_install
