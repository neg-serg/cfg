name        : rustmission
version     : "0.5.1"
release     : 1
homepage    : https://github.com/intuis/rustmission
upstreams   :
    - https://github.com/intuis/rustmission/archive/refs/tags/v0.5.1.tar.gz : d102201011c2255c48ced04107601ef3430e418f976e79a11de72f9775043d0c
summary     : TUI for Transmission daemon
description : |
    A terminal user interface for controlling the Transmission BitTorrent daemon.
license     :
    - GPL-3.0-or-later
builddeps   :
    - binary(cargo)
    - openssl-devel
networking  : true
setup       : |
    cargo fetch -v
build       : |
    %cargo_build
install       : |
    %cargo_install
