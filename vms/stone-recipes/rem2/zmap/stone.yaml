name        : zmap
version     : 4.3.1
release     : 1
homepage    : https://zmap.io/
upstreams   :
    - https://github.com/zmap/zmap/archive/refs/tags/v4.3.1.tar.gz : a281eaeac415f49734e22f9219e36454843de494ab8f9723a3de7f123142050f
summary     : Fast network scanner
description : |
    ZMap is a fast single-packet network scanner.
license     : Apache-2.0
builddeps   :
    - binary(cmake)
    - binary(make)
    - binary(gcc)
    - binary(g++)
    - cmake
    - json-c-devel
    - libpcap-devel
    - gmp-devel
    - libnl-devel
setup       : |
    %cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5
build       : |
    %make
install     : |
    %make_install
