name        : lnav
version     : "0.12.4"
release     : 1
homepage    : https://lnav.org
upstreams   :
    - https://github.com/tstack/lnav/archive/refs/tags/v0.12.4.tar.gz : ee6ea75cbfd736f6ad8b32212883e45a1a64e48085a14757d2cfffa90ebb8e75
summary     : Log file navigator
description : |
    A curses-based tool for viewing and analyzing log files
license     : BSD-2-Clause
builddeps   :
    - binary(cargo)
    - pkgconf-devel
    - pcre2-devel
    - sqlite-devel
    - ncurses-devel
    - readline-devel
    - curl-devel
    - libarchive-devel
    - zlib-devel
    - bzip2-devel
    - libunistring-devel
    - autoconf
    - automake
    - slibtool
networking  : true
setup       : |
    echo "nameserver 8.8.8.8" > /etc/resolv.conf 2>/dev/null || true
build       : |
    echo "nameserver 8.8.8.8" > /etc/resolv.conf 2>/dev/null || true
    export CC=clang
    export CXX=clang++
    export CFLAGS="$(echo "$CFLAGS" | sed 's/--param ssp-buffer-size=32 //g')"
    export CXXFLAGS="$CFLAGS"
    # Remove broken cross-compiler wrapper that confuses autotools
    rm -f /usr/bin/x86_64-pc-linux-gnu-gcc /usr/bin/gcc 2>/dev/null || true
    NOCONFIGURE=1 ./autogen.sh
    ./configure --prefix=/usr
    %make
install     : |
    %make_install
