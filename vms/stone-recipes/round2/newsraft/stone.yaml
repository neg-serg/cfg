name        : newsraft
version     : "0.26"
release     : 2
homepage    : https://codeberg.org/grisha/newsraft
upstreams   :
    - https://codeberg.org/grisha/newsraft/archive/newsraft-0.26.tar.gz : 4c96ecb5628a14b7acabff4645595326b079ca1a93c2b2cbbd1af03aef1b91ea
summary     : Feed reader for terminal
description : |
    A terminal feed reader with a curses interface
license     : MIT
builddeps   :
    - binary(make)
    - binary(gcc)
    - ncurses-devel
    - curl-devel
    - expat-devel
    - sqlite-devel
    - yajl-devel
    - gumbo-parser-devel
setup       : |
    true
build       : |
    make -j"%(jobs)" PREFIX=/usr
install       : |
    make install PREFIX=/usr DESTDIR="%(installroot)"
