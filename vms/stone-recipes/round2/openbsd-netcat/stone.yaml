name        : openbsd-netcat
version     : "1.238"
release     : 1
homepage    : https://tracker.debian.org/pkg/netcat-openbsd
upstreams   :
    - https://deb.debian.org/debian/pool/main/n/netcat-openbsd/netcat-openbsd_1.238.orig.tar.gz : 9f72a37d85dec1366309fdb0172be4e67e09ec26e89f13156315149e17c02479
summary     : TCP/IP swiss army knife (OpenBSD version)
description : |
    A simple Unix utility which reads and writes data across network connections, using TCP or UDP protocol
license     : BSD-3-Clause
builddeps   :
    - binary(make)
