name: rmlint
version: "2.10.3"
release: 1
homepage: https://github.com/sahib/rmlint
upstreams:
  - https://github.com/sahib/rmlint/archive/refs/tags/v2.10.3.tar.gz: 8ffdbd5d09d15c8717ae55497e90d6fa46f085b45ac1056f2727076da180c33e
summary: Duplicate file finder
description: |
  rmlint finds space waste and other broken things
license:
  - GPL-3.0-or-later
builddeps:
  - binary(scons)
  - binary(gcc)
  - binary(g++)
  - pkgconfig(glib-2.0)
  - pkgconfig(json-glib-1.0)
networking: true
build: |
  scons --without-gui -k 2>&1 || true
install: |
  mkdir -p %(installroot)%(prefix)/bin
  cp rmlint %(installroot)%(prefix)/bin/
