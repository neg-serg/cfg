name        : rmlint
version     : "2.10.2"
release     : 1
homepage    : https://github.com/sahib/rmlint
upstreams   :
    - https://github.com/sahib/rmlint/archive/refs/tags/v2.10.2.tar.gz : 0a0233ad517e0fb721f21e188a57cdee5279dd5329b38acb56d5d5312ce46388
summary     : Duplicate finder
description : |
    A tool to find duplicate files and other lint
license     : GPL-3.0-only
builddeps   :
    - binary(scons)
    - pkgconf-devel
    - glib2-devel
    - json-glib-devel
    - python-sphinx
    - python
networking  : true
build       : |
    export CFLAGS="$(echo "$CFLAGS" | sed 's/--param ssp-buffer-size=32 //g')"
    PREFIX=/usr scons -j "%(jobs)"
install     : |
    PREFIX=/usr DESTDIR="%(installroot)" scons install
