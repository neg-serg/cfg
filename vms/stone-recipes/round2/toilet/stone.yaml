name        : toilet
version     : "0.3"
release     : 1
homepage    : http://caca.zoy.org/wiki/toilet
upstreams   :
    - https://deb.debian.org/debian/pool/main/t/toilet/toilet_0.3.orig.tar.gz : 89d4b530c394313cc3f3a4e07a7394fa82a6091f44df44dfcd0ebcb3300a81de
summary     : The Other Implementation of figLET
description : |
    A free replacement for the FIGlet utility
license     : WTFPL
builddeps   :
    - binary(make)
    - binary(gcc)
environment : |
    unset DFLAGS CFLAGS CXXFLAGS
setup       : |
    CACA_CFLAGS=" " CACA_LIBS=" " ./configure
build       : |
    %make
install     : |
    %make_install
