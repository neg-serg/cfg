name: net-test
version: "1.0"
release: 1
homepage: https://google.com
upstreams:
  - https://github.com/neovim/neovim/archive/refs/tags/v0.12.2.tar.gz : ef9f58da7d687ed4d1dad9715542bf0dabdeedbfe8089e2ce17fff21b920a268
summary: net test
description: test
license: MIT
networking: true
setup: |
  cat /etc/resolv.conf 2>&1 || echo "no resolv.conf"
  echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf 2>/dev/null || echo "cannot fix dns"
  getent hosts google.com 2>&1 || echo "DNS FAILED"
  curl -v --max-time 10 https://google.com 2>&1 | tail -5 || echo "CURL FAILED"
build: |
  echo "build ok"
install: |
  mkdir -p /mason/install
  echo ok
