name: tabiew
version: "0.13.1"
release: 1
homepage: https://github.com/shshemi/tabiew
upstreams:
  - https://static.crates.io/crates/tabiew/tabiew-0.13.1.crate : 4266325809809dd3b5124197bdb9d7065ce1e63e28475a2b5e1c12533d9329ed
summary: A lightweight TUI to view CSV files
description: |
  Tabiew is a terminal-based CSV viewer
license:
  - MIT
builddeps:
  - binary(cargo)
  - pkgconfig(openssl)
networking: true
environment: |
  CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu
setup: |
  echo "nameserver 8.8.8.8" > /etc/resolv.conf 2>/dev/null || true
  %cargo_fetch
build: |
  echo "nameserver 8.8.8.8" > /etc/resolv.conf 2>/dev/null || true
  export CFLAGS="$(echo "$CFLAGS" | sed 's/--param ssp-buffer-size=32 //g')"
  %cargo_build
install: |
  %cargo_install
