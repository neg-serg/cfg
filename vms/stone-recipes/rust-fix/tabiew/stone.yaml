name: tabiew
version: "0.13.1"
release: 1
homepage: https://github.com/shshemi/tabiew
upstreams:
  - git|https://github.com/shshemi/tabiew:
      ref: 9226c20ba1d2eb258f834dfc61ab4ce06dfca31f # v0.13.1
summary: A lightweight TUI to view and query CSV files
description: |
  Tabiew is a lightweight terminal-based CSV viewer
license:
  - MIT
builddeps:
  - binary(cargo)
  - pkgconfig(openssl)
networking: true
environment: |
  CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu
setup: |
  echo "nameserver 8.8.8.8" > /etc/resolv.conf
  echo "nameserver 1.1.1.1" >> /etc/resolv.conf
  export CFLAGS="$(echo "$CFLAGS" | sed "s/--param ssp-buffer-size=32 //g")"
  %cargo_fetch
build: |
  echo "nameserver 8.8.8.8" > /etc/resolv.conf
  echo "nameserver 1.1.1.1" >> /etc/resolv.conf
  export CFLAGS="$(echo "$CFLAGS" | sed "s/--param ssp-buffer-size=32 //g")"
  %cargo_build
install: |
  %cargo_install
