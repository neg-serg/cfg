name        : satty
version     : "0.20.1"
release     : 1
homepage    : https://github.com/gabm/satty
upstreams   :
    - https://github.com/gabm/satty/archive/refs/tags/v0.20.1.tar.gz : 86e85e8abdcfee925f0b95d424bd9eed9ad78aeb537707132e77ccb63133ac97
summary     : Modern screenshot annotation tool
description : |
    Satty is a small screenshot annotation tool with a modern UI.
license     :
    - MPL-2.0
builddeps   :
    - binary(cargo)
    - fontconfig-devel
    - libepoxy-devel
    - pkgconfig(gdk-pixbuf-2.0)
    - pkgconfig(gtk4)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
