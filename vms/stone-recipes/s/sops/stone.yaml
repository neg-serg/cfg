name        : sops
version     : "3.9.1"
release     : 1
homepage    : https://github.com/getsops/sops
upstreams   :
    - https://github.com/getsops/sops/archive/refs/tags/v3.9.1.tar.gz : d79e8caaef3134d00f759231e8ef587b791996e2e45319ffe83dee1ab01aebda
summary     : Secrets management tool
description : |
    SOPS is an editor of encrypted files that supports YAML, JSON, ENV, INI and BINARY formats.
license     :
    - MPL-2.0
builddeps   :
    - binary(go)
networking  : true
build       : |
    go build -o sops .
install       : |
    %install_bin sops
