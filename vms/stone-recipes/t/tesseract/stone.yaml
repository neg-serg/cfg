name        : tesseract
version     : "5.5.0"
release     : 1
homepage    : https://github.com/tesseract-ocr/tesseract
upstreams   :
    - https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.0.tar.gz : f2fb34ca035b6d087a42875a35a7a5c4155fa9979c6132365b1e5a28ebc3fc11
summary     : OCR engine
description : |
    Tesseract Open Source OCR Engine
license     :
    - Apache-2.0
builddeps   :
    - binary(cmake)
    - binary(gcc)
    - binary(g++)
    - leptonica-devel
    - pkgconfig(libpng)
    - libtiff-devel
    - libarchive-devel
    - pkgconfig(libcurl)
setup       : |
    %cmake -DBUILD_TRAINING_TOOLS=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
