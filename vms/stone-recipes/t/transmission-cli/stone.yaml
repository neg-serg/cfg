name        : transmission-cli
version     : "4.0.6"
release     : 1
homepage    : https://transmissionbt.com
upstreams   :
    - https://github.com/transmission/transmission/archive/refs/tags/4.0.6.tar.gz : bcc0e5f96497521e98fa7b224d1864f270484ad215a974f8dedeb818e6720d13
summary     : A BitTorrent client (CLI)
description : |
    A fast, easy, and free BitTorrent client (CLI only).
license     :
    - GPL-2.0-or-later
    - MIT
builddeps   :
    - binary(make)
    - binary(gcc)
    - binary(cmake)
    - pkgconfig(openssl)
    - pkgconfig(glib-2.0)
    - pkgconfig(libcurl)
setup       : |
    %cmake -DENABLE_CLI=ON -DENABLE_DAEMON=ON -DENABLE_GTK=OFF -DENABLE_QT=OFF -DENABLE_MAC=OFF -DENABLE_NLS=OFF
build       : |
    %make
install     : |
    %make_install
