name        : tabiew
version     : 0.13.1
release     : 4
homepage    : https://crates.io/crates/tabiew
summary     : TUI for viewing tabular data
description : |
    A lightweight TUI to view and query tabular data files
license     : MIT
builddeps   :
    - binary(cargo)
    - binary(perl)
networking  : true
build       : |
    echo "nameserver 8.8.8.8" > /etc/resolv.conf
    echo "nameserver 1.1.1.1" >> /etc/resolv.conf
    export CFLAGS="$(echo $CFLAGS | sed 's/--param ssp-buffer-size=32 //g')"
    export OPENSSL_NO_VENDOR=1
    cargo install tabiew --version 0.13.1 --root %(installroot)%(prefix)
