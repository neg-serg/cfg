name: test-repo-check
version: "1.0"
release: 1
homepage: https://example.com
upstreams: []
summary: test
description: test
license: MIT
builddeps:
  - binary(gcc)
setup: |
  moss repo list > /tmp/repos.txt 2>&1 || true
  cat /tmp/repos.txt
  moss info libcaca-devel > /tmp/pkg-check.txt 2>&1 || true
  cat /tmp/pkg-check.txt
  ls /mason/sourcedir/ > /tmp/sourcedir.txt 2>&1 || true
  cat /tmp/sourcedir.txt
build: |
  mkdir -p %(installroot)/usr/share
  echo "done" > %(installroot)/usr/share/test.txt
install: |
  mkdir -p %(installroot)/usr/share
  echo "done" > %(installroot)/usr/share/test.txt
