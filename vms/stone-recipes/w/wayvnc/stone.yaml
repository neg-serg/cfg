name        : wayvnc
version     : "0.10.0"
release     : 1
homepage    : https://github.com/any1/wayvnc
upstreams   :
    - https://github.com/any1/wayvnc/archive/refs/tags/v0.10.0.tar.gz: fcfda018d0e07ec00a80071420c8cc2a75885dc6d5e55bb50a9b12353754338f
summary     : VNC server for wlroots Wayland compositors
description : |
    A VNC server for wlroots-based Wayland compositors.
license     :
    - ISC
builddeps   :
    - binary(meson)
    - binary(gcc)
    - pkgconfig(wayland-client)
    - pkgconfig(pixman-1)
setup       : |
    %meson
build       : |
    %meson_build
install       : |
    %meson_install
