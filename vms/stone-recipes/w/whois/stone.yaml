name        : whois
version     : "5.6.6"
release     : 1
homepage    : https://github.com/rfc1036/whois
upstreams   :
    - https://github.com/rfc1036/whois/archive/refs/tags/v5.6.6.tar.gz: 43d3b3cc64c75e8bd10aee6feff3906e9488ed335076d206e70f3b25bf644969
summary     : Intelligent WHOIS client
description : |
    A modern WHOIS client with support for multiple WHOIS servers.
license     :
    - GPL-2.0-only
builddeps   :
    - binary(perl)
    - binary(msgfmt)
    - binary(xgettext)
    - binary(make)
    - binary(gcc)
setup       : |
    %make
build       : |
    %make
install     : install -Dm00755 -t %(installroot)/usr/bin whois mkpasswd
