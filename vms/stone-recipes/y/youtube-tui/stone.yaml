name        : youtube-tui
version     : "0.9.4"
release     : 1
homepage    : https://github.com/siriusmart/youtube-tui
upstreams   :
    - https://github.com/siriusmart/youtube-tui/archive/refs/tags/v0.9.4.tar.gz: ac31c7c0600c47509384df27f1af2c4ec6644de988a703ca13856b147c675934
summary     : YouTube TUI client
description : |
    A terminal user interface for browsing and watching YouTube videos.
license     :
    - MIT
builddeps   :
    - binary(cargo)
    - binary(python3)
    - binary(make)
    - binary(gcc)
    - binary(pkg-config)
    - pkgconfig(openssl)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
